<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f8">
<title>스도쿠</title>
<link rel="icon" href="../icons/sudoku.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  /* Calm paper look: cool off-white page, white board, navy given digits, blue player digits. */
  :root {
    color-scheme: light;
    --bg: #f2f4f8; --paper: #ffffff; --ink: #1d2838; --muted: #6a7587; --line: #dbe1ea; --soft: #e9eef5;
    --accent: #3d6fd6; --accent-d: #2c55ad; --accent-l: #e7eefc; --gold: #f2b232; --red: #d9473f; --red-l: #fde9e7; --green: #2f9e7a;
    --grid: #33415a; --thin: #ccd4e0;
    --peer: #edf2fb; --same: #c9dafa; --sel: #a9c4f7; --given: #1d2838; --mine: #2f62d0;
    --num: "Nunito", "Noto Sans KR", system-ui, sans-serif;
    --kr: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font-family: var(--kr); overscroll-behavior: none; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow: hidden; }
  button, a { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #app { position: relative; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 14px) calc(env(safe-area-inset-left, 0px) + 16px); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- HUD ---------- */
  #top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  #top > :first-child { justify-self: start; } #top > :last-child { justify-self: end; }
  .chip { height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chip svg { width: 15px; height: 15px; }
  #stageName { text-align: center; font-weight: 900; font-size: 19px; line-height: 1.1; white-space: nowrap; }
  #stageName small { display: block; font-weight: 700; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  #info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { height: 42px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 0; }
  .stat small { font-size: 12px; color: var(--muted); font-weight: 700; }
  .stat b { font-family: var(--num); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
  #dots { display: inline-flex; gap: 4px; }
  #dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--soft); box-shadow: inset 0 0 0 1.5px var(--thin); }
  #dots i.on { background: var(--red); box-shadow: none; }
  #mistakeStat.bump { animation: bump 380ms ease-out; }
  @keyframes bump { 30% { background: var(--red-l); border-color: var(--red); } }

  /* ---------- board ---------- */
  #stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
  #board { --bs: 340px; --cs: calc((var(--bs) - 10px) / 9); position: relative; width: var(--bs); height: var(--bs); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px; padding: 2px;
    background: var(--grid); border-radius: 12px; box-shadow: 0 10px 28px rgba(40, 60, 100, 0.13); touch-action: none; }
  .box { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1px; background: var(--thin); overflow: hidden; }
  .box:nth-child(1) { border-top-left-radius: 10px; } .box:nth-child(3) { border-top-right-radius: 10px; }
  .box:nth-child(7) { border-bottom-left-radius: 10px; } .box:nth-child(9) { border-bottom-right-radius: 10px; }
  .cell { position: relative; background: var(--paper); display: grid; place-items: center; font-family: var(--num); font-size: calc(var(--cs) * 0.62); font-weight: 700; line-height: 1; cursor: pointer; transition: background-color 120ms; }
  .cell.g { color: var(--given); font-weight: 800; }
  .cell.m { color: var(--mine); }
  .cell.h { color: var(--green); }
  .cell.x { color: var(--red); background: var(--red-l); }
  .cell.peer { background: var(--peer); }
  .cell.same { background: var(--same); }
  .cell.sel { background: var(--sel); }
  .cell.x.sel, .cell.x.same { background: #f9cfcb; }
  .cell .v { display: block; }
  .cell.pop .v { animation: pop 260ms ease-out; }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0.2; } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .cell.shake .v { animation: shake 320ms ease-out; }
  @keyframes shake { 20% { transform: translateX(-12%); } 45% { transform: translateX(10%); } 70% { transform: translateX(-5%); } }
  .cell.flash::after { content: ""; position: absolute; inset: 0; background: var(--fc, var(--accent)); opacity: 0; animation: flash 520ms ease-out backwards; animation-delay: var(--d, 0ms); pointer-events: none; }
  @keyframes flash { 25% { opacity: 0.32; } 100% { opacity: 0; } }
  .cell.hintMark::before { content: ""; position: absolute; inset: 2px; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--green); animation: hintRing 1.6s ease-out forwards; pointer-events: none; }
  @keyframes hintRing { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  .notes { position: absolute; inset: 1px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); font-size: calc(var(--cs) * 0.27); font-weight: 700; color: #7b8698; }
  .notes span { display: grid; place-items: center; border-radius: 4px; }
  .notes span.hl { background: var(--accent); color: #fff; }
  #board.win .cell { animation: wave 900ms ease-in-out backwards; animation-delay: var(--w); }
  @keyframes wave { 0% { background: var(--paper); } 35% { background: #ffe7a6; transform: scale(0.92); } 70% { background: #fff6dc; transform: scale(1); } 100% { background: var(--paper); } }
  #board.win { animation: glow 1.4s 0.5s ease-out; }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(242, 178, 50, 0.85), 0 10px 28px rgba(40, 60, 100, 0.13); } 100% { box-shadow: 0 0 0 30px rgba(242, 178, 50, 0), 0 10px 28px rgba(40, 60, 100, 0.13); } }
  #board.lost .cell { filter: saturate(0.4); }

  #toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 54px); translate: -50% 0; min-height: 42px; display: flex; align-items: center; justify-content: center; z-index: 20; width: max-content; max-width: calc(100% - 16px); background: rgba(29, 40, 56, 0.94); color: #fff; font-size: 14px; font-weight: 700; line-height: 1.4; padding: 9px 16px; border-radius: 16px; pointer-events: none; text-align: center; transition: opacity 220ms, translate 220ms; }
  #toast.fade { opacity: 0; translate: -50% -6px; }
  #toast.hint { background: rgba(32, 120, 92, 0.96); }

  /* ---------- tools + pad ---------- */
  #tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tool { position: relative; height: 52px; padding: 0 2px; border-radius: 16px; border: 0; background: transparent; font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .tool svg { width: 24px; height: 24px; }
  .tool:active { background: var(--soft); }
  .tool:disabled { opacity: 0.35; }
  .tool .cnt { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: #fff; font-family: var(--num); font-size: 11.5px; font-weight: 800; display: grid; place-items: center; }
  .tool .tag { position: absolute; top: 2px; left: calc(50% + 6px); height: 17px; padding: 0 5px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 10px; font-weight: 900; display: grid; place-items: center; }
  #memo.on { color: var(--accent); }
  #memo.on .tag { background: var(--accent); color: #fff; }
  #pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
  .key { height: 62px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; box-shadow: 0 2px 0 var(--line); color: var(--mine); }
  .key b { font-family: var(--num); font-weight: 800; font-size: 28px; line-height: 1; }
  .key small { font-family: var(--num); font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1; }
  .key:active { translate: 0 2px; box-shadow: none; background: var(--accent-l); }
  .key.done { opacity: 0.3; box-shadow: none; }
  .key.done small { visibility: hidden; }
  #pad.memo .key { color: var(--muted); border-style: dashed; }
  #pad.memo .key b { font-size: 22px; }

  /* ---------- panels ---------- */
  .panel { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; overflow-y: auto; background: var(--bg);
    padding: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-right, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 18px) calc(env(safe-area-inset-left, 0px) + 16px); }
  .panel > .center { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
  .panel h1 { margin: 0; font-size: 50px; font-weight: 900; letter-spacing: -0.02em; }
  .panel h2 { margin: 0; font-size: 25px; font-weight: 900; }
  .panel p.lead { margin: 0; color: var(--muted); font-size: 15px; font-weight: 500; }
  .btns { display: flex; flex-direction: column; gap: 10px; width: min(340px, 100%); }
  .row3 { display: flex; gap: 8px; }
  .row3 > * { flex: 1 1 0; min-width: 0; }
  .btn { height: 46px; padding: 0 6px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; text-decoration: none; box-shadow: 0 3px 0 var(--line); }
  .btn:active { translate: 0 2px; box-shadow: 0 1px 0 var(--line); }
  .btn.primary { height: 58px; font-size: 21px; font-weight: 900; color: #fff; background: var(--accent); border: 0; box-shadow: 0 4px 0 var(--accent-d); }
  .btn.primary:active { box-shadow: 0 2px 0 var(--accent-d); }

  .logo { width: 132px; height: 132px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px; padding: 3px; background: var(--grid); border-radius: 18px; box-shadow: 0 10px 26px rgba(40, 60, 100, 0.16); }
  .logo span { background: var(--paper); display: grid; place-items: center; font-family: var(--num); font-weight: 800; font-size: 28px; color: var(--given); }
  .logo span:nth-child(1) { border-top-left-radius: 15px; } .logo span:nth-child(3) { border-top-right-radius: 15px; }
  .logo span:nth-child(7) { border-bottom-left-radius: 15px; } .logo span:nth-child(9) { border-bottom-right-radius: 15px; }
  .logo span.f { color: var(--mine); animation: logoFill 4.5s ease-in-out infinite backwards; animation-delay: var(--d); }
  @keyframes logoFill { 0%, 8% { color: transparent; background: var(--paper); } 12% { color: var(--mine); background: var(--same); transform: scale(1.12); } 18%, 86% { color: var(--mine); background: var(--paper); transform: scale(1); } 94%, 100% { color: transparent; } }

  .help { list-style: none; margin: 0; padding: 0; width: min(400px, 100%); display: grid; gap: 7px; text-align: left; }
  .help li { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 12px; font-size: 14px; font-weight: 500; line-height: 1.35; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; }
  .help .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-l); color: var(--accent); display: grid; place-items: center; font-family: var(--num); font-weight: 800; font-size: 14px; }
  .help .ic svg { width: 18px; height: 18px; }
  .help .ic.red { background: var(--red-l); color: var(--red); }
  .help .ic.gold { background: #fdf3d9; color: #c98a06; }
  .stats { width: min(400px, 100%); display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats div { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 9px 4px; }
  .stats b { display: block; font-family: var(--num); font-size: 24px; font-weight: 800; }
  .stats small { font-size: 12px; color: var(--muted); font-weight: 700; }
  .recs { list-style: none; margin: 0; padding: 0; width: min(400px, 100%); display: grid; gap: 6px; text-align: left; }
  .recs li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 14px; font-weight: 700; }
  .recs li.h { background: transparent; border: 0; padding: 0 12px; font-size: 11.5px; color: var(--muted); }
  .recs li .n { font-family: var(--num); color: var(--muted); font-size: 13px; min-width: 42px; text-align: right; }
  .recs li .s { color: #d99b12; font-family: var(--num); min-width: 46px; text-align: right; }
  .recs li .t { font-family: var(--num); font-size: 13px; min-width: 64px; text-align: right; }
  .recs li .t em { font-style: normal; color: var(--muted); font-weight: 500; font-size: 11px; margin-left: 3px; }

  /* stage select */
  #select { justify-content: flex-start; gap: 12px; }
  #select .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: min(480px, 100%); }
  #select .head .chip { justify-self: start; }
  #select .head .tot { justify-self: end; font-family: var(--num); font-weight: 800; color: #d99b12; font-size: 17px; }
  #resume { width: min(480px, 100%); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; text-align: left; padding: 11px 16px; border-radius: 18px; border: 0; color: #fff; background: linear-gradient(120deg, #3d6fd6, #5a8be6); box-shadow: 0 4px 0 var(--accent-d); }
  #resume b { display: block; font-size: 16px; font-weight: 900; }
  #resume small { font-size: 13px; opacity: 0.9; font-family: var(--num); font-weight: 700; }
  #resume .go { font-weight: 900; font-size: 14px; background: rgba(255,255,255,0.22); border-radius: 999px; padding: 6px 12px; }
  #pages { width: min(480px, 100%); display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--soft); padding: 4px; border-radius: 14px; }
  #pages button { height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 0; border-radius: 10px; background: transparent; font-family: var(--num); font-size: 13px; font-weight: 800; color: var(--muted); padding: 0; }
  #pages button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(40, 60, 100, 0.15); }
  #pages button small { font-size: 10px; color: #d99b12; display: block; line-height: 1; }
  #chapters { width: min(480px, 100%); display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .chap h3 { margin: 6px 2px 8px; font-size: 15px; font-weight: 900; display: flex; align-items: baseline; gap: 8px; }
  .chap h3 .tg { font-size: 12px; font-weight: 700; color: var(--muted); }
  .chap h3 .sum { margin-left: auto; font-family: var(--num); color: #d99b12; font-weight: 800; font-size: 14px; }
  .chap h3 i { width: 10px; height: 10px; border-radius: 3px; background: var(--tc); align-self: center; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .lv { position: relative; height: 70px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--num); font-weight: 800; font-size: 20px; box-shadow: 0 3px 0 var(--line); padding: 0; overflow: hidden; }
  .lv::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--tc); }
  .lv small { font-size: 11px; letter-spacing: 1px; color: var(--gold); line-height: 1; }
  .lv small i { font-style: normal; color: #e1e5ec; }
  .lv em { font-style: normal; font-size: 10.5px; color: var(--muted); font-weight: 700; line-height: 1; min-height: 10px; }
  .lv.done { background: #fbfcff; }
  .lv.cur { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-d); }
  .lv.saved::after { content: ""; position: absolute; right: 7px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .lv:disabled { opacity: 0.42; cursor: default; box-shadow: none; }
  .lv:disabled small { display: none; }
  .lv .lock { width: 14px; height: 14px; color: var(--muted); }

  /* result card (over the board) */
  #result { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; padding: 16px; background: rgba(242, 244, 248, 0.66); backdrop-filter: blur(3px); }
  #result .card2 { width: min(360px, 100%); background: var(--paper); border-radius: 24px; border: 1.5px solid var(--line); padding: 22px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 18px 44px rgba(40, 60, 100, 0.22); animation: rise 340ms cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { translate: 0 30px; opacity: 0; scale: 0.94; } }
  #rTitle { font-size: 28px; }
  #rStars { font-size: 48px; letter-spacing: 6px; color: var(--gold); line-height: 1; }
  #rStars i { font-style: normal; color: #e4e8ef; display: inline-block; }
  #rStars .s { display: inline-block; animation: starIn 460ms cubic-bezier(.2,.9,.3,1.5) backwards; }
  @keyframes starIn { from { scale: 0; rotate: -90deg; } }
  #rMsg { margin: 0; font-size: 15px; color: var(--muted); font-weight: 700; line-height: 1.5; }
  #rMsg b { color: var(--ink); font-family: var(--num); font-weight: 800; }
  #rBadge { font-weight: 900; color: #fff; background: linear-gradient(90deg, var(--accent), #6a5ae0); border-radius: 999px; padding: 4px 14px; font-size: 14px; animation: starIn 500ms 300ms backwards; }
  #result .btns { width: 100%; }
  .confetti { position: absolute; top: -12px; width: 8px; height: 12px; z-index: 24; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { translate: var(--dx) 105vh; rotate: var(--r); } }

  /* landscape phones: board on the left, HUD + tools + 3×3 pad on the right */
  @media (orientation: landscape) and (max-height: 560px) {
    #app { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 340px); grid-template-rows: auto auto auto 1fr; column-gap: 18px; row-gap: 8px; }
    #stage { grid-column: 1; grid-row: 1 / 5; }
    #toast { left: auto; right: calc(env(safe-area-inset-right, 0px) + 16px); translate: 0 0; width: auto; max-width: 340px; }
    #toast.fade { translate: 0 -6px; }
    #top, #info, #tools, #pad { grid-column: 2; }
    #top { grid-row: 1; } #info { grid-row: 2; } #tools { grid-row: 3; } #pad { grid-row: 4; align-self: end; }
    #pad { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; align-self: stretch; min-height: 0; gap: 6px; }
    .key { height: auto; min-height: 0; flex-direction: row; gap: 6px; }
    .key b { font-size: 24px; }
    .tool { height: 46px; }
    .stat { height: 36px; }
    .panel h1 { font-size: 36px; }
    .panel { gap: 10px; }
    .panel > .center { gap: 10px; }
    .logo { width: 84px; height: 84px; border-radius: 13px; }
    .logo span { font-size: 18px; }
    .logo span:nth-child(1) { border-top-left-radius: 10px; } .logo span:nth-child(3) { border-top-right-radius: 10px; }
    .logo span:nth-child(7) { border-bottom-left-radius: 10px; } .logo span:nth-child(9) { border-bottom-right-radius: 10px; }
    .help { grid-template-columns: 1fr 1fr; width: min(720px, 100%); }
    .lv { height: 56px; }
    .grid { grid-template-columns: repeat(10, 1fr); }
    #select .head, #resume, #pages, #chapters { width: min(720px, 100%); }
  }
  @media (min-height: 740px) and (orientation: portrait) { .key { height: 70px; } .key b { font-size: 31px; } .tool { height: 58px; } #app { gap: 12px; } .stat { height: 46px; } }
  @media (max-height: 700px) and (orientation: portrait) { .key { height: 52px; } .tool { height: 46px; } #app { gap: 8px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="chip" id="toSelect" type="button" aria-label="단계 선택">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>단계</button>
    <div id="stageName">1탄<small>입문</small></div>
    <button class="chip" id="mute" type="button" aria-pressed="false">소리 켜짐</button>
  </div>
  <div id="info">
    <div class="stat" id="mistakeStat"><small>실수</small><span id="dots"><i></i><i></i><i></i></span></div>
    <div class="stat"><small>시간</small><b id="time">0:00</b></div>
    <div class="stat"><small>최고</small><b id="best">-</b></div>
  </div>
  <div id="stage">
    <div id="board" role="grid" aria-label="스도쿠 판"></div>
  </div>
  <div id="toast" class="fade" role="status" aria-live="polite"></div>
  <div id="tools">
    <button class="tool" id="undo" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5 4 9.5 8.5 14M4.5 9.5H14a5.5 5.5 0 0 1 0 11h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>되돌리기</button>
    <button class="tool" id="erase" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11v14H9l-6-7 6-7ZM12.5 9.5l5 5M17.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>지우기</button>
    <button class="tool" id="memo" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4ZM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>메모<span class="tag" id="memoTag">OFF</span></button>
    <button class="tool" id="hint" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6.5 6.5 0 0 0-3.8 11.8V17h7.6v-2.2A6.5 6.5 0 0 0 12 3ZM9.2 20.5h5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>힌트<span class="cnt" id="hintN">3</span></button>
  </div>
  <div id="pad"></div>

  <div id="result" hidden>
    <div class="card2">
      <h2 id="rTitle">클리어!</h2>
      <div id="rStars"></div>
      <div id="rBadge" hidden>최고 기록!</div>
      <p id="rMsg"></p>
      <div class="btns">
        <button class="btn primary" id="rNext" type="button">다음 탄</button>
        <div class="row3">
          <button class="btn" id="rRetry" type="button">다시 하기</button>
          <button class="btn" id="rSelect" type="button">단계 선택</button>
          <button class="btn" id="rHome" type="button">처음으로</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="title">
    <div class="center">
      <div class="logo" aria-hidden="true"><span>5</span><span class="f" style="--d:0.2s">3</span><span>7</span><span class="f" style="--d:0.7s">6</span><span>1</span><span class="f" style="--d:1.2s">9</span><span>8</span><span class="f" style="--d:1.7s">2</span><span>4</span></div>
      <h1>스도쿠</h1>
      <p class="lead">빈칸에 1~9를 채우는 숫자 퍼즐 게임</p>
      <div class="btns">
        <button class="btn primary" id="start" type="button">시작</button>
        <div class="row3">
          <button class="btn" id="howto" type="button">게임 설명</button>
          <button class="btn" id="rank" type="button">순위 보기</button>
          <a class="btn" id="toMenu" href="../">게임 선택</a>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="help" hidden>
    <div class="center">
      <h2>게임 설명</h2>
      <ul class="help" id="helpList"></ul>
      <div class="btns"><button class="btn" id="helpBack" type="button">돌아가기</button></div>
    </div>
  </div>

  <div class="panel" id="records" hidden>
    <div class="center">
      <h2>내 기록</h2>
      <div class="stats" id="stats"></div>
      <ul class="recs" id="recs"></ul>
      <div class="btns"><button class="btn" id="recBack" type="button">돌아가기</button></div>
    </div>
  </div>

  <div class="panel" id="select" hidden>
    <div class="head"><button class="chip" id="selBack" type="button">처음으로</button><h2>단계 선택</h2><span class="tot" id="selTot">★ 0</span></div>
    <button id="resume" type="button" hidden><span><b id="resumeT">이어하기</b><small id="resumeS"></small></span><span class="go">계속</span></button>
    <div id="pages" role="tablist"></div>
    <div id="chapters"></div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
