<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>스타 슈터</title>
<style>
  /* Layout: HUD row, canvas stage (drag anywhere to fly), thumb bar with bomb + fire buttons. Single dark space look by choice. */
  :root {
    --bg: #0b1026;
    --panel: #141b3a;
    --fg: #eef1ff;
    --muted: #8e98c9;
    --accent: #ffc94d;
    --danger: #ff5d6c;
    --blue: #4da3ff;
    --ship: #6ee7d8;
    color-scheme: dark;
    --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; display: flex; flex-direction: column; padding-inline: 16px; padding-block: 10px; gap: 8px; max-width: 520px; margin-inline: auto; }
  #hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font-size: 20px; font-variant-numeric: tabular-nums; }
  #hud small { color: var(--muted); font-size: 12px; display: block; }
  #hud .mid { text-align: center; line-height: 1.2; }
  #lives { letter-spacing: 3px; color: var(--danger); font-size: 20px; display: block; }
  #power { color: var(--blue); font-size: 13px; letter-spacing: 2px; display: block; }
  #stage { position: relative; flex: 1; min-height: 0; border-radius: 16px; overflow: hidden; background: var(--panel); touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 22px; background: rgba(11, 16, 38, 0.86); }
  #overlay h1 { margin: 0; font-size: 36px; font-weight: 400; text-wrap: balance; }
  #overlay p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; text-wrap: balance; }
  #overlay p b { color: var(--fg); font-weight: 400; }
  #overlay .big { font-size: 42px; color: var(--accent); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: #1a1400; border: 0; cursor: pointer; touch-action: none; }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  #rec { display: grid; grid-template-columns: auto auto auto; column-gap: 18px; row-gap: 2px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; max-height: 150px; overflow-y: auto; padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,0.06); }
  #rec .h { font-size: 12px; }
  #rec .n { color: var(--accent); }
  #rec[hidden] { display: none; }
  #start { font-size: 22px; background: var(--accent); border-radius: 999px; padding: 12px 36px; }
  #pad { height: 92px; display: flex; align-items: center; justify-content: space-between; gap: 12px; touch-action: none; }
  #hint { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .cbtn { border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  #bomb { width: 70px; height: 70px; background: var(--danger); font-size: 15px; }
  #bomb[disabled] { background: #4a3a4f; color: #9a8aa0; }
  #fire { width: 92px; height: 92px; background: var(--accent); font-size: 20px; }
  .cbtn small { font-size: 13px; }
  .cbtn.on { filter: brightness(0.78); transform: scale(0.96); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">

</head>
<body>
<div id="app">
  <div id="hud">
    <div><small id="clock">점수</small><span id="score">0</span></div>
    <div class="mid"><span id="lives" aria-label="남은 목숨"></span><span id="power" aria-label="화력"></span></div>
    <div style="text-align:right"><small>최고 기록</small><span id="best">0</span></div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h1 id="title">스타 슈터</h1>
      <p id="msg">화면을 <b>드래그</b>하면 손가락 움직임만큼 우주선이 움직여요.<br><b>연사</b> 버튼을 누르고 있으면 미사일이 계속 나가요.<br>파란 <b>P</b>는 미사일 강화(3단계), 붉은 <b>B</b>는 폭탄이에요.<br>위기일 때 <b>폭탄</b>으로 화면을 싹 비우세요.<br>1분마다 난이도가 올라가고, 분마다 최고 점수가 기록돼요.</p>
      <div class="big" id="final" hidden></div>
      <div id="rec" hidden></div>
      <button id="start" type="button">시작</button>
    </div>
  </div>
  <div id="pad">
    <div id="hint">화면을 드래그해서 이동<br>(PC: 방향키·Space·B)</div>
    <button id="bomb" class="cbtn" type="button">폭탄<small id="bombN">x2</small></button>
    <button id="fire" class="cbtn" type="button">연사</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d'), stage = $('stage');
  const scoreEl = $('score'), bestEl = $('best'), livesEl = $('lives'), powerEl = $('power');
  const overlay = $('overlay'), titleEl = $('title'), msgEl = $('msg'), finalEl = $('final'), startBtn = $('start');
  const clockEl = $('clock'), recEl = $('rec');
  const fireBtn = $('fire'), bombBtn = $('bomb'), bombN = $('bombN');

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  let W = 300, H = 500, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (ship) { ship.tx = clamp(ship.tx, 18, W - 18); ship.ty = clamp(ship.ty, H * 0.3, H - 34); }
  }

  let best = 0;
  try { best = +localStorage.getItem('meteor-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  const bgStars = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.4, v: Math.random() * 30 + 10 }));

  let ship = null, bullets = [], ebullets = [], enemies = [], items = [], parts = [], rings = [];
  let score = 0, lives = 3, power = 1, bombs = 2, running = false, elapsed = 0, inv = 0, hitFlash = 0, flash = 0, fireCd = 0;
  let tRock = 0, tScout = 0, tGun = 0, tTank = 0, tSup = 0;
  let minuteScores = [], newMin = [], curMin = 0, banner = null;
  let recs = [];
  try { recs = JSON.parse(localStorage.getItem('meteor-min') || '[]') || []; } catch (e) {}
  let held = { btn: false, key: false }, keys = { l: false, r: false, u: false, d: false }, drag = null, last = 0, lastBoom = 0;

  function reset() {
    ship = { x: W / 2, y: H - 90, tx: W / 2, ty: H - 90, r: 13 };
    bullets = []; ebullets = []; enemies = []; items = []; parts = []; rings = [];
    score = 0; lives = 3; power = 1; bombs = 2; elapsed = 0; inv = 1.2; hitFlash = 0; flash = 0; fireCd = 0;
    minuteScores = []; newMin = []; curMin = 0; banner = null;
    tRock = 0.5; tScout = 7; tGun = 18; tTank = 45; tSup = 20; drag = null;
    updateHud();
  }

  /* ---------- HUD ---------- */
  let hs = '';
  function updateHud() {
    const s = Math.floor(score);
    const sec = Math.floor(elapsed), key = [s, lives, power, bombs, sec].join();
    if (key === hs) return; hs = key;
    scoreEl.textContent = s;
    clockEl.textContent = '점수 · Lv' + (Math.floor(sec / 60) + 1) + ' ' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(Math.max(0, 3 - lives));
    powerEl.textContent = '화력 ' + '■'.repeat(power) + '□'.repeat(3 - power);
    bombN.textContent = 'x' + bombs; bombBtn.disabled = bombs <= 0;
  }

  /* ---------- sound ---------- */
  let actx = null;
  function beep(freq, dur, type = 'sine', vol = 0.06, f2) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t); if (f2) o.frequency.linearRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(t + dur);
    } catch (e) {}
  }
  function boom(big) {
    const n = performance.now(); if (n - lastBoom < 70 && !big) return; lastBoom = n;
    beep(big ? 90 : 160, big ? 0.5 : 0.12, 'sawtooth', big ? 0.12 : 0.04, 40);
  }

  /* ---------- spawning ---------- */
  const mins = () => elapsed / 60;
  const diff = () => Math.min(mins(), 4);

  function addRock(coin) {
    const r = coin ? 12 : rnd(13, 28), vy = 130 + diff() * 90 + rnd(0, 70);
    enemies.push({ k: coin ? 'coin' : 'rock', x: rnd(r, W - r), y: -r, vx: 0, vy: coin ? vy * 0.7 : vy, r, hp: coin ? 1 : (r < 18 ? 1 : r < 24 ? 2 : 3), rot: rnd(0, 6), vr: rnd(-2, 2), pts: r < 18 ? 20 : r < 24 ? 30 : 50 });
  }
  function addScoutWave() {
    const n = 4 + Math.min(Math.floor(mins()), 3), x0 = rnd(80, W - 80), amp = Math.min(60, x0 - 20, W - x0 - 20), vy = 120 + diff() * 35;
    for (let i = 0; i < n; i++) enemies.push({ k: 'scout', x: x0, x0, y: -20 - i * 38, vy, r: 13, hp: 1, ph: 0, amp, pts: 50, t: 0 });
  }
  function addGunner() {
    enemies.push({ k: 'gunner', x: rnd(40, W - 40), y: -20, vx: rnd(-40, 40) || 30, r: 16, hp: 3, mode: 'in', hy: rnd(70, 130), cd: 0.8, rate: Math.max(0.7, 1.5 - mins() * 0.2), hold: 7, pts: 150 });
  }
  function addTank() {
    enemies.push({ k: 'tank', x: rnd(60, W - 60), y: -30, vx: 28, r: 24, hp: 14 + Math.min(Math.floor(mins()), 6) * 3, maxHp: 14 + Math.min(Math.floor(mins()), 6) * 3, mode: 'in', hy: 90, cd: 1, rate: Math.max(1.0, 1.9 - mins() * 0.15), hold: 10, pts: 500 });
  }

  function ebullet(x, y, vx, vy) { ebullets.push({ x, y, vx, vy, r: 4 }); }
  function shoot(e) {
    const sp = 170 + diff() * 40;
    if (e.k === 'gunner') {
      const dx = ship.x - e.x, dy = ship.y - e.y, d = Math.hypot(dx, dy) || 1;
      ebullet(e.x, e.y + e.r, dx / d * sp, dy / d * sp);
    } else {
      for (const a of [-0.42, 0, 0.42]) ebullet(e.x, e.y + e.r, Math.sin(a) * sp * 0.9, Math.cos(a) * sp * 0.9);
    }
  }

  function dropFrom(e) {
    const r = Math.random();
    let kind = null;
    if (e.k === 'tank') kind = power < 3 ? 'P' : 'B';
    else if (e.k === 'gunner') kind = r < 0.4 ? 'P' : r < 0.55 ? 'B' : null;
    else if (e.k === 'scout') kind = r < 0.06 ? 'P' : null;
    else if (e.k === 'rock') kind = r < 0.03 ? 'P' : r < 0.04 ? 'B' : null;
    if (kind) items.push({ k: kind, x: e.x, y: e.y, vy: 90 });
  }

  function explode(x, y, color, n) {
    for (let i = 0; i < n && parts.length < 240; i++) {
      const a = rnd(0, 6.28), s = rnd(40, 200);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rnd(0.3, 0.6), c: color });
    }
  }
  function killEnemy(e, silent) {
    if (e.dead) return;
    e.dead = true;
    explode(e.x, e.y, e.k === 'scout' ? '#ff9f43' : e.k === 'rock' ? '#ff8a96' : '#c58bff', e.k === 'tank' ? 36 : 12);
    if (!silent) { score += e.pts || 0; dropFrom(e); boom(e.k === 'tank'); }
  }
  function hitEnemy(e, dmg) {
    e.hp -= dmg; e.flashT = 0.07;
    if (e.hp <= 0) killEnemy(e);
  }

  function hurt() {
    if (inv > 0 || !running) return;
    lives--; power = Math.max(1, power - 1); inv = 1.8; hitFlash = 0.35;
    ebullets = ebullets.filter(b => Math.hypot(b.x - ship.x, b.y - ship.y) > 90);
    explode(ship.x, ship.y, '#6ee7d8', 18);
    beep(120, 0.25, 'sawtooth', 0.08, 60);
    if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
    updateHud();
    if (lives <= 0) gameOver();
  }

  function useBomb() {
    if (!running || bombs <= 0) return;
    bombs--; flash = 0.55; inv = Math.max(inv, 1.5);
    rings.push({ x: ship.x, y: ship.y, t: 0 });
    for (const e of enemies) {
      if (e.k === 'coin' || e.dead) continue;
      if (e.k === 'tank') hitEnemy(e, 10); else killEnemy(e);
    }
    ebullets = [];
    boom(true); updateHud();
  }

  function fire() {
    const y = ship.y - 16, mk = (x, yy, vx) => bullets.push({ x, y: yy, vx, vy: -640 });
    if (power === 1) mk(ship.x, y, 0);
    else if (power === 2) { mk(ship.x - 8, y, 0); mk(ship.x + 8, y, 0); }
    else { mk(ship.x, y - 4, 0); mk(ship.x - 10, y, -120); mk(ship.x + 10, y, 120); }
    beep(900, 0.04, 'square', 0.012);
  }

  /* ---------- update ---------- */
  function update(dt) {
    elapsed += dt; score += dt;
    const m = Math.floor(elapsed / 60);
    if (m > curMin) {
      curMin = m; score += 300 * m;
      const v = Math.floor(score); minuteScores[m - 1] = v;
      if (v > (recs[m - 1] || 0)) { recs[m - 1] = v; newMin[m - 1] = true; try { localStorage.setItem('meteor-min', JSON.stringify(recs)); } catch (e) {} }
      banner = { txt: m + '분 돌파! 난이도 UP', t: 2.4 };
      beep(523, 0.12, 'square', 0.05); setTimeout(() => beep(784, 0.2, 'square', 0.05), 120);
    }
    inv = Math.max(0, inv - dt); hitFlash = Math.max(0, hitFlash - dt); flash = Math.max(0, flash - dt);

    // movement: smooth follow of the drag target; keys move the target
    const kx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ky = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
    if (kx || ky) { ship.tx += kx * 340 * dt; ship.ty += ky * 340 * dt; }
    ship.tx = clamp(ship.tx, 18, W - 18); ship.ty = clamp(ship.ty, H * 0.3, H - 34);
    const f = 1 - Math.exp(-dt * 26);
    ship.x += (ship.tx - ship.x) * f; ship.y += (ship.ty - ship.y) * f;

    // fire
    fireCd -= dt;
    if ((held.btn || held.key) && fireCd <= 0) { fire(); fireCd = power === 1 ? 0.16 : power === 2 ? 0.14 : 0.12; }

    // spawn
    tRock -= dt; if (tRock <= 0) { addRock(Math.random() < 0.1); tRock = Math.max(0.2, 1 / (1 + 0.45 * mins())); }
    tScout -= dt; if (elapsed > 6 && tScout <= 0) { addScoutWave(); tScout = Math.max(2.2, 7 / (1 + 0.5 * mins())); }
    tGun -= dt; if (elapsed > 16 && tGun <= 0) { addGunner(); tGun = Math.max(2.5, 9 / (1 + 0.5 * mins())); }
    tTank -= dt; if (elapsed > 40 && tTank <= 0) { addTank(); tTank = Math.max(10, 28 - 6 * mins()); }
    tSup -= dt; if (tSup <= 0) {
      tSup = 22;
      const k = power < 3 ? 'P' : bombs < 2 ? 'B' : null;
      if (k) items.push({ k, x: rnd(30, W - 30), y: -14, vy: 90 });
    }

    // bullets
    for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }

    // enemies
    for (const e of enemies) {
      e.t = (e.t || 0) + dt; if (e.flashT) e.flashT -= dt;
      if (e.k === 'rock' || e.k === 'coin') { e.y += e.vy * dt; e.rot += e.vr * dt; }
      else if (e.k === 'scout') { e.y += e.vy * dt; e.x = clamp(e.x0 + Math.sin(e.t * 2.6) * e.amp, e.r, W - e.r); }
      else {
        if (e.mode === 'in') { e.y += (e.k === 'tank' ? 70 : 110) * dt; if (e.y >= e.hy) e.mode = 'hold'; }
        else if (e.mode === 'hold') {
          e.x += e.vx * dt; if (e.x < e.r || e.x > W - e.r) { e.vx = -e.vx; e.x = clamp(e.x, e.r, W - e.r); }
          e.cd -= dt; if (e.cd <= 0) { shoot(e); e.cd = e.rate; }
          e.hold -= dt; if (e.hold <= 0) e.mode = 'out';
        } else e.y += 160 * dt;
      }
    }

    // player bullets vs enemies
    for (const b of bullets) {
      for (const e of enemies) {
        if (e.dead || e.k === 'coin' || e.y < -e.r * 0.5) continue;
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) { b.dead = true; hitEnemy(e, 1); break; }
      }
    }

    // enemies vs ship
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - ship.x, e.y - ship.y) < e.r * 0.85 + ship.r * 0.8) {
        if (e.k === 'coin') { e.dead = true; score += 10; beep(880, 0.08); explode(e.x, e.y, '#ffc94d', 6); }
        else if (inv <= 0) { hurt(); if (e.k === 'rock' || e.k === 'scout') killEnemy(e, true); }
      }
    }
    for (const b of ebullets) if (Math.hypot(b.x - ship.x, b.y - ship.y) < b.r + ship.r * 0.7) { b.dead = true; hurt(); }

    // items
    for (const it of items) {
      it.y += it.vy * dt;
      if (Math.hypot(it.x - ship.x, it.y - ship.y) < 14 + ship.r) {
        it.dead = true;
        if (it.k === 'P') { if (power < 3) power++; else score += 300; beep(660, 0.12, 'triangle', 0.07, 990); }
        else { if (bombs < 5) bombs++; else score += 300; beep(440, 0.12, 'triangle', 0.07, 700); }
        updateHud();
      }
    }

    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    for (const r of rings) r.t += dt;

    bullets = bullets.filter(b => !b.dead && b.y > -20 && b.x > -20 && b.x < W + 20);
    ebullets = ebullets.filter(b => !b.dead && b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);
    enemies = enemies.filter(e => !e.dead && e.y < H + 50);
    items = items.filter(i => !i.dead && i.y < H + 20);
    parts = parts.filter(p => p.t < p.life);
    rings = rings.filter(r => r.t < 0.6);
    updateHud();
  }

  /* ---------- drawing ---------- */
  function star(x, y, r, rot, color) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }

  function drawEnemy(e) {
    const hit = e.flashT > 0, x = e.x, y = e.y, r = e.r;
    if (e.k === 'coin') { star(x, y, r, e.rot, '#ffc94d'); return; }
    if (e.k === 'rock') {
      ctx.save(); ctx.translate(x, y); ctx.rotate(e.rot);
      ctx.beginPath();
      for (let i = 0; i < 9; i++) { const a = i / 9 * 6.283, rr = r * (0.8 + 0.2 * Math.sin(i * 7.3 + r)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fillStyle = hit ? '#fff' : '#ff5d6c'; ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(r * 0.25, -r * 0.2, r * 0.25, 0, 7); ctx.fill();
      ctx.restore(); return;
    }
    if (e.k === 'scout') {
      ctx.fillStyle = hit ? '#fff' : '#ff9f43';
      ctx.beginPath(); ctx.moveTo(x, y + r); ctx.lineTo(x - r, y - r * 0.7); ctx.lineTo(x, y - r * 0.2); ctx.lineTo(x + r, y - r * 0.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7a3300'; ctx.fillRect(x - 2, y - 4, 4, 6); return;
    }
    if (e.k === 'gunner') {
      ctx.fillStyle = hit ? '#fff' : '#a56bff';
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.8, 0, 0, 7); ctx.fill();
      ctx.fillRect(x - 3, y + r * 0.4, 6, r * 0.8);
      ctx.fillStyle = '#2a1050'; ctx.beginPath(); ctx.arc(x, y - 2, r * 0.38, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff5d6c'; ctx.beginPath(); ctx.arc(x, y - 2, r * 0.16, 0, 7); ctx.fill();
      return;
    }
    // tank
    ctx.fillStyle = hit ? '#fff' : '#d4553f';
    ctx.fillRect(x - r, y - r * 0.7, r * 2, r * 1.4);
    ctx.fillStyle = hit ? '#fff' : '#8f2e1e'; ctx.fillRect(x - r - 5, y - r * 0.4, 6, r * 1.2); ctx.fillRect(x + r - 1, y - r * 0.4, 6, r * 1.2);
    ctx.fillStyle = '#3a0f08'; ctx.fillRect(x - 4, y + r * 0.5, 8, r * 0.7);
    ctx.fillStyle = '#ffc94d'; ctx.beginPath(); ctx.arc(x, y - 2, 6, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x - r, y - r - 8, r * 2, 4);
    ctx.fillStyle = '#7dff9a'; ctx.fillRect(x - r, y - r - 8, r * 2 * Math.max(0, e.hp) / e.maxHp, 4);
  }

  function render(dt) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#c9d3ff';
    for (const s of bgStars) {
      s.y += s.v * dt / H; if (s.y > 1) s.y = 0;
      ctx.globalAlpha = 0.35 + s.s * 0.25; ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    for (const it of items) {
      const c = it.k === 'P' ? '#4da3ff' : '#ff5d6c', pulse = 1 + Math.sin(performance.now() / 120) * 0.12;
      ctx.fillStyle = c; ctx.globalAlpha = 0.28; ctx.beginPath(); ctx.arc(it.x, it.y, 17 * pulse, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(it.x, it.y, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '15px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.k, it.x, it.y + 1);
    }
    for (const e of enemies) drawEnemy(e);

    ctx.fillStyle = '#ffc94d';
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
    ctx.fillStyle = '#ffd9a0';
    for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1, 0, 7); ctx.fill(); }
    for (const b of ebullets) { ctx.fillStyle = '#ff7a3d'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 1, 0, 7); ctx.fill(); }

    if (ship && running) {
      const blink = inv > 0 && Math.floor(inv * 12) % 2 === 0;
      if (!blink) {
        const x = ship.x, y = ship.y;
        ctx.fillStyle = '#6ee7d8';
        ctx.beginPath(); ctx.moveTo(x, y - 22); ctx.lineTo(x + 18, y + 16); ctx.lineTo(x, y + 8); ctx.lineTo(x - 18, y + 16); ctx.closePath(); ctx.fill();
        if (power >= 2) { ctx.fillStyle = '#4da3ff'; ctx.fillRect(x - 15, y - 2, 4, 12); ctx.fillRect(x + 11, y - 2, 4, 12); }
        if (power >= 3) { ctx.fillStyle = '#ffc94d'; ctx.fillRect(x - 2, y - 24, 4, 8); }
        ctx.fillStyle = '#ffc94d'; ctx.beginPath(); ctx.moveTo(x - 6, y + 12); ctx.lineTo(x, y + 22 + Math.random() * 8); ctx.lineTo(x + 6, y + 12); ctx.fill();
      }
    }

    for (const p of parts) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const r of rings) {
      const k = r.t / 0.6;
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, k * Math.max(W, H) * 1.1, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (banner) {
      banner.t -= dt; if (banner.t <= 0) banner = null;
      else { ctx.globalAlpha = Math.min(1, banner.t); ctx.fillStyle = '#ffc94d'; ctx.font = '26px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(banner.txt, W / 2, H * 0.2); ctx.globalAlpha = 1; }
    }
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 1.2})`; ctx.fillRect(0, 0, W, H); }
    if (hitFlash > 0) { ctx.fillStyle = `rgba(255,93,108,${hitFlash})`; ctx.fillRect(0, 0, W, H); }
  }

  function loop(t) {
    const dt = Math.min((t - last) / 1000 || 0, 0.05); last = t;
    if (running) update(dt);
    render(dt);
    requestAnimationFrame(loop);
  }

  /* ---------- screens ---------- */
  function renderRec() {
    const n = Math.min(10, Math.max(recs.length, minuteScores.length));
    if (!n) { recEl.hidden = true; return; }
    let h = '<b class="h">구간</b><b class="h">이번</b><b class="h">최고</b>';
    for (let i = 0; i < n; i++) {
      const cur = minuteScores[i], b = recs[i];
      h += `<span>${i + 1}분</span><span>${cur ?? '-'}</span><span class="${newMin[i] ? 'n' : ''}">${b ?? '-'}${newMin[i] ? ' ★' : ''}</span>`;
    }
    recEl.innerHTML = h; recEl.hidden = false;
  }
  function gameOver() {
    running = false; held.btn = held.key = false; fireBtn.classList.remove('on');
    const final = Math.floor(score), isBest = final > best;
    if (isBest) { best = final; bestEl.textContent = best; try { localStorage.setItem('meteor-best', best); } catch (e) {} }
    titleEl.textContent = isBest ? '새 기록!' : '게임 오버';
    msgEl.textContent = isBest ? '최고 기록을 갱신했어요.' : `최고 기록은 ${best}점이에요.`;
    finalEl.textContent = final + '점'; finalEl.hidden = false;
    renderRec(); startBtn.textContent = '다시 하기'; overlay.hidden = false;
  }
  function begin() { reset(); overlay.hidden = true; running = true; beep(520, 0.1); }
  startBtn.addEventListener('click', begin);

  /* ---------- input ---------- */
  // Relative drag: the ship moves by how far the finger moves, so it never jumps to where the finger lands.
  const SENS = 1.25;
  stage.addEventListener('pointerdown', e => {
    if (!running || drag) return;
    drag = { id: e.pointerId, px: e.clientX, py: e.clientY, sx: ship.tx, sy: ship.ty };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    ship.tx = clamp(drag.sx + (e.clientX - drag.px) * SENS, 18, W - 18);
    ship.ty = clamp(drag.sy + (e.clientY - drag.py) * SENS, H * 0.3, H - 34);
  });
  const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => stage.addEventListener(n, endDrag));

  fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); fireBtn.setPointerCapture(e.pointerId); held.btn = true; fireBtn.classList.add('on'); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => fireBtn.addEventListener(n, () => { held.btn = false; fireBtn.classList.remove('on'); }));
  bombBtn.addEventListener('pointerdown', e => { e.preventDefault(); useBomb(); });
  [fireBtn, bombBtn, stage].forEach(el => el.addEventListener('contextmenu', e => e.preventDefault()));

  const keyMap = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd' };
  window.addEventListener('keydown', e => {
    if (keyMap[e.key]) { keys[keyMap[e.key]] = true; e.preventDefault(); }
    else if (e.key === ' ') { held.key = true; e.preventDefault(); }
    else if (e.key === 'b' || e.key === 'B') useBomb();
  });
  window.addEventListener('keyup', e => {
    if (keyMap[e.key]) keys[keyMap[e.key]] = false;
    else if (e.key === ' ') held.key = false;
  });
  window.addEventListener('blur', () => { held.btn = held.key = false; keys.l = keys.r = keys.u = keys.d = false; });

  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(stage);
  resize(); reset(); renderRec();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
