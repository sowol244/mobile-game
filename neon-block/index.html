<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07071a">
<title>네온 블록</title>
<style>
  /* Layout: HUD (score / combo / best) above one canvas holding the 8x8 board and the 3-piece tray. Dark neon on purpose. */
  :root {
    --bg: #07071a;
    --panel: #0d0d2b;
    --fg: #e9ecff;
    --muted: #7f86b8;
    --cyan: #00f0ff;
    --pink: #ff2fd1;
    --yellow: #ffe600;
    color-scheme: dark;
    --num: "Orbitron", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --kr: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: radial-gradient(120% 80% at 50% 0%, #15103a 0%, var(--bg) 60%); color: var(--fg); font-family: var(--kr); overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; display: flex; flex-direction: column; padding-inline: 16px; padding-block: 10px; gap: 8px; max-width: 560px; margin-inline: auto; box-sizing: border-box; }
  #hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; }
  #hud small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 0.12em; }
  #hud .v { font-family: var(--num); font-weight: 900; font-variant-numeric: tabular-nums; }
  #score { font-size: 34px; color: var(--cyan); text-shadow: 0 0 12px rgba(0, 240, 255, 0.7); line-height: 1.1; }
  #best { font-size: 18px; color: var(--pink); text-shadow: 0 0 10px rgba(255, 47, 209, 0.6); }
  #hud .r { text-align: right; }
  #combo { min-width: 84px; text-align: center; font-family: var(--num); font-weight: 700; font-size: 13px; color: var(--yellow); text-shadow: 0 0 10px rgba(255, 230, 0, 0.7); padding-bottom: 6px; }
  #stage { position: relative; flex: 1; min-height: 0; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 22px; background: rgba(7, 7, 26, 0.88); border-radius: 16px; }
  #overlay h1 { margin: 0; font-size: 40px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 6px var(--cyan), 0 0 22px rgba(0, 240, 255, 0.7); letter-spacing: 0.04em; }
  #overlay p { margin: 0; color: #b9bfe8; font-size: 15px; line-height: 1.65; text-wrap: balance; }
  #overlay b { color: var(--yellow); font-weight: 500; }
  #final { font-family: var(--num); font-weight: 900; font-size: 40px; color: var(--pink); text-shadow: 0 0 16px rgba(255, 47, 209, 0.8); font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }
  #start { font-size: 20px; font-weight: 700; color: #04121a; background: var(--cyan); border: 0; border-radius: 999px; padding: 12px 40px; box-shadow: 0 0 22px rgba(0, 240, 255, 0.6); }
  #start:active { transform: scale(0.97); }
  #start:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@500;700&display=swap">
</head>
<body>
<div id="app">
  <div id="hud">
    <div><small>점수</small><span class="v" id="score">0</span></div>
    <div id="combo" aria-live="polite"></div>
    <div class="r"><small>최고 기록</small><span class="v" id="best">0</span></div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h1 id="title">네온 블록</h1>
      <p id="msg">아래 블록을 <b>드래그</b>해서 8×8 판에 놓으세요.<br>가로나 세로 한 줄을 채우면 사라져요.<br>연속으로 지우면 <b>콤보</b>, 판을 싹 비우면 <b>보너스</b>!<br>블록은 회전할 수 없어요.</p>
      <div id="final" hidden></div>
      <button id="start" type="button">시작</button>
    </div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
