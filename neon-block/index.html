<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07071a">
<title>네온 블록</title>
<style>
  /* Layout: HUD (score / combo / best) above one canvas holding the 8x8 board and the 3-piece tray. Dark neon on purpose. */
  :root {
    --bg: #07071a;
    --panel: #0d0d2b;
    --fg: #e9ecff;
    --muted: #7f86b8;
    --cyan: #00f0ff;
    --pink: #ff2fd1;
    --yellow: #ffe600;
    color-scheme: dark;
    --num: "Orbitron", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --kr: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: radial-gradient(120% 80% at 50% 0%, #15103a 0%, var(--bg) 60%); color: var(--fg); font-family: var(--kr); overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; display: flex; flex-direction: column; padding-inline: 16px; padding-block: 10px; gap: 8px; max-width: 560px; margin-inline: auto; box-sizing: border-box; }
  #hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; }
  #hud small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 0.12em; }
  #hud .v { font-family: var(--num); font-weight: 900; font-variant-numeric: tabular-nums; }
  #score { font-size: 34px; color: var(--cyan); text-shadow: 0 0 12px rgba(0, 240, 255, 0.7); line-height: 1.1; }
  #best { font-size: 18px; color: var(--pink); text-shadow: 0 0 10px rgba(255, 47, 209, 0.6); }
  #hud .r { text-align: right; }
  #mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #mute { font: inherit; font-size: 11px; color: var(--muted); background: transparent; border: 1px solid #2c2c70; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  #mute:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #combo { min-width: 84px; min-height: 1.3em; text-align: center; font-family: var(--num); font-weight: 700; font-size: 13px; color: var(--yellow); text-shadow: 0 0 10px rgba(255, 230, 0, 0.7); padding-bottom: 0; }
  #stage { position: relative; flex: 1; min-height: 0; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 22px; overflow-y: auto; background: rgba(7, 7, 26, 0.88); border-radius: 16px; }
  #overlay h1 { margin: 0; font-size: 40px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 6px var(--cyan), 0 0 22px rgba(0, 240, 255, 0.7); letter-spacing: 0.04em; }
  #overlay p { margin: 0; color: #b9bfe8; font-size: 15px; line-height: 1.65; text-wrap: balance; }
  #overlay b { color: var(--yellow); font-weight: 500; }
  #final { font-family: var(--num); font-weight: 900; font-size: 40px; color: var(--pink); text-shadow: 0 0 16px rgba(255, 47, 209, 0.8); font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }
  #overlay > :first-child { margin-top: auto; }
  #overlay > :last-child { margin-bottom: auto; }
  #reg { display: flex; gap: 8px; width: min(340px, 100%); }
  #nick { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: #12123a; border: 1px solid #2c2c70; border-radius: 12px; padding: 10px 12px; -webkit-user-select: text; user-select: text; }
  #nick:focus-visible { outline: 2px solid var(--cyan); }
  #net { min-height: 1.2em; font-size: 14px; color: var(--yellow); }
  #rows { list-style: none; margin: 0; padding: 0; width: min(340px, 100%); display: grid; gap: 4px; text-align: left; }
  #rows li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 7px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); font-size: 15px; }
  #rows li.me { background: rgba(255, 230, 0, 0.16); box-shadow: inset 0 0 0 1px rgba(255, 230, 0, 0.6); }
  #rows .rk { font-family: var(--num); font-weight: 700; color: var(--muted); font-size: 13px; }
  #rows .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rows .sc { font-family: var(--num); font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; font-size: 14px; }
  #overlay.board #msg, #overlay.board #final, #overlay.board #reg, #overlay.board #showBoard, #overlay.board #howto { display: none; }
  #coach { position: absolute; top: 6px; left: 8px; right: 8px; z-index: 2; background: rgba(13, 13, 43, 0.94); border: 1px solid rgba(0, 240, 255, 0.55); box-shadow: 0 0 16px rgba(0, 240, 255, 0.25); border-radius: 14px; padding: 8px 12px 10px; text-align: left; }
  #coach .ct { display: flex; justify-content: space-between; align-items: center; font-family: var(--num); font-weight: 700; font-size: 11px; color: var(--cyan); letter-spacing: 0.1em; }
  #cskip { font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid #2c2c70; border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  #cskip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #ctext { margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: var(--fg); text-wrap: balance; }
  #ctext.ok { color: var(--yellow); }
  #ctext.warn { color: #ff8aa0; }
  #btns { display: flex; flex-direction: column; gap: 10px; width: min(340px, 100%); }
  #prim { display: flex; flex-direction: column; gap: 10px; }
  #prim button { width: 100%; height: 52px; padding: 0 16px; }
  #sec { display: flex; gap: 8px; }
  #sec .sub { flex: 1 1 0; min-width: 0; height: 44px; padding: 0 6px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; box-sizing: border-box; }
  .sub { font-size: 16px; font-weight: 700; color: var(--cyan); background: transparent; border: 1px solid rgba(0, 240, 255, 0.6); border-radius: 999px; padding: 10px 22px; }
  a.sub { text-decoration: none; cursor: pointer; }
  .sub:disabled { opacity: 0.45; }
  .sub:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #start, #resume { font-size: 20px; font-weight: 700; color: #04121a; background: var(--cyan); border: 0; border-radius: 999px; padding: 12px 40px; box-shadow: 0 0 22px rgba(0, 240, 255, 0.6); }
  #start:active, #resume:active { transform: scale(0.97); }
  #start:focus-visible, #resume:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@500;700&display=swap">
</head>
<body>
<div id="app">
  <div id="hud">
    <div><small>점수</small><span class="v" id="score">0</span></div>
    <div id="mid"><div id="combo" aria-live="polite"></div><button id="mute" type="button" aria-pressed="false">소리 켜짐</button></div>
    <div class="r"><small>최고 기록</small><span class="v" id="best">0</span></div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="coach" hidden>
      <div class="ct"><span id="cstep"></span><button id="cskip" type="button">건너뛰기</button></div>
      <p id="ctext" role="status" aria-live="polite"></p>
    </div>
    <div id="overlay">
      <h1 id="title">네온 블록</h1>
      <p id="msg">아래 블록을 <b>드래그</b>해서 8×8 판에 놓으세요.<br>가로나 세로 한 줄을 채우면 사라져요.<br>연속으로 지우면 <b>콤보</b>, 판을 싹 비우면 <b>보너스</b>!<br>블록은 회전할 수 없어요.</p>
      <div id="final" hidden></div>
      <div id="reg" hidden>
        <input id="nick" type="text" maxlength="12" placeholder="닉네임 (12자)" autocomplete="off" aria-label="닉네임">
        <button class="sub" id="submit" type="button">점수 등록</button>
      </div>
      <div id="net" role="status" aria-live="polite"></div>
      <ol id="rows" hidden></ol>
      <div id="btns">
        <div id="prim">
          <button id="resume" type="button" hidden>이어하기</button>
          <button id="start" type="button">시작</button>
        </div>
        <div id="sec">
          <button class="sub" id="home" type="button" hidden>처음으로</button>
          <button class="sub" id="howto" type="button">게임 방법</button>
          <a class="sub" id="toMenu" href="../">게임 선택</a>
          <button class="sub" id="showBoard" type="button">순위 보기</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
