<!doctype html>
<html lang="ko">

<style>

  main { max-width: 420px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  a { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: #241e3a; color: inherit; text-decoration: none; font-size: 18px; }
  a img { width: 64px; height: 64px; border-radius: 14px; display: block; }
  a:focus-visible { outline: 3px solid #ffd23f; outline-offset: 2px; }
  .note { margin: 8px 0 0; color: #9a93b8; font-size: 14px; line-height: 1.5; text-align: center; }
  a small { display: block; margin-top: 4px; color: #9a93b8; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>모바일게임 작업실 (by 석)</h1>

  <a href="gravity-crash/"><img src="icons/gravity-crash.png" alt=""><span>Gravity Crash<small>중력을 돌려 블록을 터뜨리는 퍼즐 게임</small></span></a>
  <a href="one-move/"><img src="icons/one-move.png" alt=""><span>ONE MOVE<small>타일 하나씩 옮겨 숫자를 합치는 퍼즐 게임</small></span></a>
  <a href="meteor-dodge/"><img src="icons/meteor-dodge.png" alt=""><span>스타 슈터<small>적을 쏘며 우주를 나는 슈팅 게임</small></span></a>
