<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>레트로 블록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&display=swap">
<style>
  /* NES-style framed layout: LINES header + playfield (left), SCORE/NEXT/LEVEL/STATISTICS boxes (right),
     controller below (portrait) or on both sides (landscape). --cell is set by JS so blocks stay pixel-crisp. */
  :root {
    --cell: 24px;
    --bg: #000;
    --fg: #fcfcfc;
    --grey: #7c7c7c;
    --red: #f83800;
    --acc: #3cbcfc;
    --acc2: #0058f8;
    --px: "Press Start 2P", "Do Hyeon", monospace;
    --kr: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font-family: var(--kr); overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  #app { position: relative; height: 100%; max-width: 560px; margin-inline: auto; display: flex; flex-direction: column;
    padding: max(8px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); gap: 8px; }

  /* ---------- screen (NES-style framed layout) ---------- */
  #screen { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #layout { display: flex; gap: calc(var(--cell) * 0.3); align-items: stretch; }
  #well { display: flex; flex-direction: column; gap: calc(var(--cell) * 0.3); }
  .box { position: relative; background: #000; border: 3px solid #bcbcbc; border-radius: 7px; box-shadow: 0 0 0 2px #000, 0 0 0 4px #5c5c5c, inset 0 0 0 2px #000, inset 0 0 0 3px #3c3c3c; font-family: var(--px); line-height: 1; }
  #linesBox { height: calc(var(--cell) * 1.5); display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * 0.5); letter-spacing: 0.04em; white-space: nowrap; }
  #linesBox .hi { color: var(--fg); }
  #fieldWrap { position: relative; padding: calc(var(--cell) * 0.25); background: #000; border-radius: 3px;
    background-image: linear-gradient(#000, #000), repeating-linear-gradient(90deg, #a8a8a8 0 2px, #7c7c7c 2px 4px);
    background-clip: content-box, border-box; border: 0; box-shadow: 0 0 0 2px #000, 0 0 0 4px #bcbcbc, 0 0 0 6px #000; }
  #field { width: calc(var(--cell) * 10); height: calc(var(--cell) * 20); background: #000; touch-action: none; }
  #pop { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-family: var(--px); font-size: calc(var(--cell) * 0.75); color: #fcfcfc; text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; pointer-events: none; opacity: 0; line-height: 1.4; }
  #pop.kr { font-family: var(--kr); font-size: calc(var(--cell) * 1.9); color: #fca044; }
  #pop.show { animation: pop 1.1s steps(8) forwards; }
  @keyframes pop { 0% { opacity: 1; transform: scale(0.6); } 15% { transform: scale(1.1); } 25%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-20px); } }
  #pausedMask { position: absolute; inset: calc(var(--cell) * 0.25); background: #000; display: flex; align-items: center; justify-content: center; font-family: var(--px); font-size: calc(var(--cell) * 0.6); }

  #side { width: calc(var(--cell) * 4); display: flex; flex-direction: column; gap: calc(var(--cell) * 0.3); }
  #side small { display: block; font-size: calc(var(--cell) * 0.36); color: var(--fg); letter-spacing: 0.02em; }
  #scoreBox b, #levelBox b { display: block; font-weight: 400; font-size: calc(var(--cell) * 0.46); color: var(--fg); margin-top: calc(var(--cell) * 0.18); }
  #scoreBox { padding: calc(var(--cell) * 0.35) calc(var(--cell) * 0.28); }
  #scoreBox small + b + small { margin-top: calc(var(--cell) * 0.4); }
  #nextBox { padding: calc(var(--cell) * 0.3) calc(var(--cell) * 0.28) calc(var(--cell) * 0.35); }
  #nextC { width: calc(var(--cell) * 3); height: calc(var(--cell) * 1.667); margin: calc(var(--cell) * 0.25) auto 0; }
  #levelBox { padding: calc(var(--cell) * 0.3) calc(var(--cell) * 0.28); }
  #statsBox { flex: 1; min-height: 0; padding: calc(var(--cell) * 0.3) calc(var(--cell) * 0.2); display: flex; flex-direction: column; }
  #statsBox small { text-align: center; }
  #stats { flex: 1; display: flex; flex-direction: column; justify-content: space-around; margin-top: calc(var(--cell) * 0.15); }
  .st { display: flex; align-items: center; justify-content: space-between; gap: 2px; }
  .st canvas { width: calc(var(--cell) * 1.5); height: calc(var(--cell) * 0.75); }
  .st span { font-family: var(--px); font-size: calc(var(--cell) * 0.42); color: var(--red); }
  #typeLbl { color: var(--acc); margin-right: 0.6em; }

  /* ---------- coach (tutorial, replaces statistics) ---------- */
  #coach { flex: 1; min-height: 0; padding: calc(var(--cell) * 0.35) calc(var(--cell) * 0.25); display: flex; flex-direction: column; gap: 6px; font-family: var(--kr); border-color: #fca044; }
  #cstep { font-family: var(--px); font-size: calc(var(--cell) * 0.36); color: #fca044; }
  #ctext { margin: 0; font-size: max(13px, calc(var(--cell) * 0.62)); line-height: 1.35; word-break: keep-all; }
  #ctext b { color: #fca044; font-weight: 400; }
  #ctext.warn { color: #f878f8; }
  #cpc { font-size: max(11px, calc(var(--cell) * 0.45)); color: var(--grey); margin: 0; }
  #coach .cb { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  #coach button { font-family: var(--kr); font-size: max(13px, calc(var(--cell) * 0.55)); padding: 6px 4px; background: #000; border: 2px solid #bcbcbc; border-radius: 6px; }
  #cnext { background: var(--red) !important; border-color: #fcfcfc !important; }

  /* ---------- controller ---------- */
  #pad { flex: none; height: clamp(168px, 26vh, 230px); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px;
    background: linear-gradient(#262626, #161616); border-radius: 16px; padding: 10px 12px; box-shadow: inset 0 2px 0 #3a3a3a, inset 0 -3px 0 #0a0a0a, 0 0 0 2px #000; touch-action: none; }
  #dpad { --d: min(158px, calc(100% - 4px)); position: relative; width: var(--dsize, 158px); height: var(--dsize, 158px); touch-action: none; }
  #dpad .arm { position: absolute; background: #111; box-shadow: inset 0 2px 0 #3c3c3c, inset 0 -3px 0 #000, 0 3px 0 #000; display: flex; align-items: center; justify-content: center; color: #6c6c6c; font-size: 18px; pointer-events: none; }
  #dpad .h { left: 0; right: 0; top: 33%; height: 34%; border-radius: 8px; }
  #dpad .v { top: 0; bottom: 0; left: 33%; width: 34%; border-radius: 8px; }
  #dpad .hub { position: absolute; left: 33%; top: 33%; width: 34%; height: 34%; background: #111; pointer-events: none; }
  #dpad .hub::after { content: ''; position: absolute; inset: 28%; border-radius: 50%; background: radial-gradient(#0a0a0a, #1c1c1c); }
  #dpad i { position: absolute; font-style: normal; color: #8a8a8a; font-size: calc(var(--dsize, 158px) * 0.13); line-height: 1; pointer-events: none; }
  #dpad .il { left: 6%; top: 50%; transform: translateY(-50%); } #dpad .ir { right: 6%; top: 50%; transform: translateY(-50%); }
  #dpad .id { bottom: 5%; left: 50%; transform: translateX(-50%); } #dpad .iu { top: 5%; left: 50%; transform: translateX(-50%); }
  #dpad .iu.off { opacity: 0.25; }
  #dpad .lit { position: absolute; background: rgba(252, 252, 252, 0.16); border-radius: 8px; pointer-events: none; display: none; }
  #dpad[data-dir="left"] .lit { display: block; left: 0; top: 33%; width: 40%; height: 34%; }
  #dpad[data-dir="right"] .lit { display: block; right: 0; top: 33%; width: 40%; height: 34%; }
  #dpad[data-dir="down"] .lit { display: block; bottom: 0; left: 33%; width: 34%; height: 40%; }
  #dpad[data-dir="up"] .lit { display: block; top: 0; left: 33%; width: 34%; height: 40%; }

  #mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-width: 0; }
  @media (orientation: portrait) {
    #pad { position: relative; }
    #mid { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); flex-direction: row; gap: 14px; z-index: 1; }
    #ab { grid-column: 3; }
  }
  .pill { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 4px 2px; color: var(--red); font-family: var(--kr); font-size: 13px; letter-spacing: 0.04em; }
  .pill::after { content: ''; width: 46px; height: 13px; border-radius: 8px; background: #111; box-shadow: inset 0 2px 0 #3c3c3c, 0 2px 0 #000; }
  .pill:active::after, .pill.on::after { background: #3a3a3a; }

  #ab { position: relative; width: var(--absize, 168px); height: var(--dsize, 158px); touch-action: none; }
  .rb { position: absolute; width: 50%; aspect-ratio: 1; border: 0; padding: 0; background: none; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  .rb .cap { width: 82%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #ff6a4a, #d82800 55%, #8a1800); box-shadow: 0 4px 0 #4a0c00, 0 0 0 3px #0a0a0a, 0 0 0 5px #2c2c2c; display: flex; align-items: center; justify-content: center; font-family: var(--px); font-size: 15px; color: #fcd8c8; pointer-events: none; }
  .rb.down .cap { transform: translateY(3px); box-shadow: 0 1px 0 #4a0c00, 0 0 0 3px #0a0a0a, 0 0 0 5px #2c2c2c; filter: brightness(1.15); }
  .rb small { font-family: var(--px); font-size: 9px; color: var(--red); margin-top: 7px; pointer-events: none; }
  #bBtn { left: 0; bottom: 4%; }
  #aBtn { right: 0; top: 4%; }

  /* ---------- overlay panels ---------- */
  #overlay { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; touch-action: pan-y; background: rgba(0, 0, 0, 0.9); }
  .panel { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(360px, 100%); margin: auto 0; text-align: center; }
  #overlay h1 { margin: 0; font-family: var(--kr); font-weight: 400; font-size: 54px; line-height: 1.05; letter-spacing: 0.02em; color: #fcfcfc; text-shadow: 4px 4px 0 var(--acc2), 8px 8px 0 #000; }
  #overlay h1 span:nth-child(2) { color: var(--acc); }
  #overlay h2 { margin: 0; font-family: var(--kr); font-weight: 400; font-size: 32px; color: #fcfcfc; text-shadow: 3px 3px 0 var(--acc2); }
  #overlay p { margin: 0; font-size: 17px; line-height: 1.5; color: #d8d8d8; word-break: keep-all; }
  #overlay p b { color: #fca044; font-weight: 400; }
  #logo { width: 192px; height: 96px; }
  #final { font-family: var(--px); font-size: 26px; color: #fcfcfc; text-shadow: 3px 3px 0 var(--red); }
  #finalInfo { font-family: var(--px); font-size: 11px !important; color: var(--grey) !important; line-height: 1.6 !important; }
  .btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .go { width: 100%; height: 54px; font-family: var(--kr); font-size: 24px; color: #fcfcfc; background: var(--red); border: 3px solid #fcfcfc; border-radius: 8px; box-shadow: 0 4px 0 #000, 0 0 0 2px #000, 0 4px 0 2px #000; text-shadow: 2px 2px 0 #7a1c00; }
  .go:active { transform: translateY(2px); }
  .go.ghost { background: #000; font-size: 19px; height: 48px; border-color: #bcbcbc; text-shadow: none; }
  .row { display: flex; gap: 8px; width: 100%; }
  .row > * { flex: 1 1 0; min-width: 0; }
  .sub { height: 46px; padding: 0 4px; font-family: var(--kr); font-size: 17px; color: #fcfcfc; background: #000; border: 3px solid #bcbcbc; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; text-decoration: none; }
  .sub:active { background: #222; }
  .go:focus-visible, .sub:focus-visible, .sel:focus-visible, .opt:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

  /* setup (game type / level / height) */
  .lbl { font-family: var(--px); font-size: 11px; color: var(--acc); align-self: flex-start; margin-bottom: -4px; }
  .seg { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 6px; width: 100%; }
  .sel { height: 44px; padding: 0; font-family: var(--px); font-size: 13px; background: #000; color: #fcfcfc; border: 3px solid #5c5c5c; border-radius: 6px; }
  .sel.wide { font-size: 12px; height: 52px; line-height: 1.5; }
  .sel.wide em { display: block; font-style: normal; font-family: var(--kr); font-size: 14px; color: var(--grey); }
  .sel.on { border-color: #fcfcfc; background: var(--acc2); }
  .sel.on em { color: #d8e8ff; }
  #lvGrid.many .sel { height: 36px; font-size: 11px; }

  /* options */
  #optList { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 6px; }
  .opt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: #000; border: 3px solid #5c5c5c; border-radius: 8px; font-family: var(--kr); font-size: 18px; text-align: left; }
  .opt small { display: block; font-size: 13px; color: var(--grey); }
  .opt .sw { font-family: var(--px); font-size: 11px; padding: 6px 8px; border-radius: 4px; background: #2c2c2c; color: var(--grey); flex: none; }
  .opt.on { border-color: #bcbcbc; }
  .opt.on .sw { background: var(--acc2); color: #fcfcfc; }

  /* help, ranking */
  .helplist { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 5px; text-align: left; }
  .helplist li { display: grid; grid-template-columns: 54px 1fr; gap: 8px; align-items: center; padding: 7px 10px; background: #0c0c0c; border: 2px solid #2c2c2c; border-radius: 6px; font-size: 16px; line-height: 1.3; word-break: keep-all; }
  .helplist .k { font-family: var(--px); font-size: 10px; color: #fca044; text-align: center; line-height: 1.4; }
  .helplist b { color: #fca044; font-weight: 400; }
  #rows { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 4px; }
  #rows li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; background: #0c0c0c; border: 2px solid #2c2c2c; border-radius: 6px; text-align: left; }
  #rows li.me { border-color: #fca044; background: #2a1600; }
  #rows .rk { font-family: var(--px); font-size: 11px; color: var(--grey); }
  #rows .nm { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rows .nm small { display: block; font-family: var(--px); font-size: 8px; color: var(--grey); margin-top: 3px; }
  #rows .sc { font-family: var(--px); font-size: 13px; color: #fcfcfc; }
  #rankNote { font-size: 14px !important; color: var(--grey) !important; }
  #nameIn { width: 100%; height: 54px; text-align: center; font-family: var(--px), var(--kr); font-size: 20px; color: #fcfcfc; background: #000; border: 3px solid #fcfcfc; border-radius: 8px; outline: none; touch-action: manipulation; -webkit-user-select: text; user-select: text; }
  #nameIn:focus { border-color: var(--acc); }

  #flash { position: absolute; inset: 0; pointer-events: none; z-index: 4; background: #fcfcfc; opacity: 0; }

  /* ---------- landscape: D-pad left, screen centre, A/B right ---------- */
  @media (orientation: landscape) and (max-height: 600px) {
    #app { max-width: none; flex-direction: row; align-items: stretch; gap: 10px; }
    #pad { display: contents; }
    #dpad { order: 0; align-self: center; }
    #screen { order: 1; }
    #rightCol { order: 2; }
    #mid { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); flex-direction: row; gap: 10px; }
    #ab { order: 2; align-self: center; }
    .pill { font-size: 12px; }
    .pill::after { width: 40px; height: 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <div id="layout">
      <div id="well">
        <div class="box" id="linesBox"><span id="typeLbl">A-TYPE</span><span>LINES-</span><span class="hi" id="lines">000</span></div>
        <div id="fieldWrap">
          <canvas id="field" width="80" height="160" aria-label="게임 판"></canvas>
          <div id="pop" aria-live="polite"></div>
          <div id="pausedMask" hidden>PAUSE</div>
        </div>
      </div>
      <div id="side">
        <div class="box" id="scoreBox"><small>TOP</small><b id="top">000000</b><small>SCORE</small><b id="score">000000</b></div>
        <div class="box" id="nextBox"><small>NEXT</small><canvas id="nextC" width="36" height="20"></canvas></div>
        <div class="box" id="levelBox"><small>LEVEL</small><b id="level">00</b></div>
        <div class="box" id="statsBox"><small>STATS</small><div id="stats"></div></div>
        <div class="box" id="coach" hidden>
          <span id="cstep"></span>
          <p id="ctext" role="status" aria-live="polite"></p>
          <p id="cpc"></p>
          <div class="cb"><button id="cnext" type="button" hidden>완료</button><button id="cskip" type="button">건너뛰기</button></div>
        </div>
      </div>
    </div>
    <div id="flash"></div>
  </div>
  <div id="pad">
    <div id="dpad" aria-label="방향 버튼" role="group">
      <div class="arm h"></div><div class="arm v"></div><div class="hub"></div><div class="lit"></div>
      <i class="il">◀</i><i class="ir">▶</i><i class="id">▼</i><i class="iu off">▲</i>
    </div>
    <div id="mid">
      <button class="pill" id="mute" type="button" aria-pressed="false">소리</button>
      <button class="pill" id="pauseBtn" type="button">일시정지</button>
    </div>
    <div id="ab">
      <button class="rb" id="bBtn" type="button" aria-label="B: 바로 떨어뜨리기"><span class="cap">B</span></button>
      <button class="rb" id="aBtn" type="button" aria-label="A: 오른쪽으로 돌리기"><span class="cap">A</span></button>
    </div>
  </div>

  <div id="overlay">
    <div class="panel" id="pMain">
      <canvas id="logo" width="64" height="32" aria-hidden="true"></canvas>
      <h1 id="title"><span>레트로</span> <span>블록</span></h1>
      <p id="msg">떨어지는 블록으로 줄을 지우는 고전 퍼즐 게임</p>
      <div id="final" hidden></div>
      <p id="finalInfo" hidden></p>
      <div class="btns">
        <button class="go" id="start" type="button">시작</button>
        <div class="row">
          <button class="sub" id="home" type="button" hidden>처음으로</button>
          <button class="sub" id="helpBtn" type="button">게임 설명</button>
          <button class="sub" id="rankBtn" type="button">순위 보기</button>
          <a class="sub" id="toMenu" href="../">게임 선택</a>
        </div>
      </div>
    </div>

    <div class="panel" id="pAsk" hidden>
      <h2>처음이네요!</h2>
      <p>조작을 익히는 짧은 <b>튜토리얼</b>을 해 볼까요?</p>
      <div class="btns">
        <button class="go" id="askYes" type="button">튜토리얼 하기</button>
        <button class="go ghost" id="askNo" type="button">건너뛰기</button>
      </div>
    </div>

    <div class="panel" id="pSetup" hidden>
      <h2>게임 설정</h2>
      <span class="lbl">GAME TYPE</span>
      <div class="seg" style="--n:2">
        <button class="sel wide" data-mode="A" type="button">A-TYPE<em>끝없이 버티기</em></button>
        <button class="sel wide" data-mode="B" type="button">B-TYPE<em>25줄 지우기</em></button>
      </div>
      <span class="lbl">LEVEL</span>
      <div class="seg" id="lvGrid"></div>
      <span class="lbl" id="hLbl">HEIGHT</span>
      <div class="seg" id="hGrid" style="--n:6"></div>
      <div class="btns">
        <button class="go" id="play" type="button">게임 시작</button>
        <div class="row">
          <button class="sub" id="optBtn" type="button">옵션</button>
          <button class="sub back" type="button">돌아가기</button>
        </div>
      </div>
    </div>

    <div class="panel" id="pOpt" hidden>
      <h2>옵션</h2>
      <ul id="optList"></ul>
      <button class="go" id="optBack" type="button">돌아가기</button>
    </div>

    <div class="panel" id="pPause" hidden>
      <h2>일시정지</h2>
      <div class="btns">
        <button class="go" id="resume" type="button">계속하기</button>
        <button class="go ghost" id="pOptBtn" type="button">옵션</button>
        <button class="go ghost" id="quit" type="button">처음으로</button>
      </div>
    </div>

    <div class="panel" id="pHelp" hidden>
      <h2>게임 설명</h2>
      <ul class="helplist" id="helpList"></ul>
      <div class="row">
        <button class="go ghost" id="tutBtn" type="button">튜토리얼</button>
        <button class="go back" type="button">돌아가기</button>
      </div>
    </div>

    <div class="panel" id="pRank" hidden>
      <h2>순위</h2>
      <ol id="rows"></ol>
      <p id="rankNote"></p>
      <button class="go back" type="button">돌아가기</button>
    </div>

    <div class="panel" id="pEntry" hidden>
      <h2 id="eTitle">순위에 올랐어요!</h2>
      <div id="eScore" style="font-family:var(--px);font-size:22px"></div>
      <p>이름을 남겨 주세요</p>
      <input id="nameIn" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" aria-label="이름">
      <button class="go" id="save" type="button">등록</button>
    </div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
