<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5efe4">
<title>원 무브</title>
<link rel="icon" href="../icons/one-move.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  /* Warm paper look: cream background, soft board, tiles coloured by value, bold rounded numbers. */
  :root {
    color-scheme: light;
    --bg: #f5efe4; --paper: #fffaf1; --ink: #3d3530; --muted: #8c8075; --line: #e3d7c6;
    --board: #dccdb7; --cell: #ebe0cf; --accent: #e8735a; --accent-d: #c95a43; --teal: #3f9a8a; --gold: #f2b33d;
    --num: "Fredoka", "Noto Sans KR", system-ui, sans-serif;
    --kr: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font-family: var(--kr); overscroll-behavior: none; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    background-image: radial-gradient(rgba(140, 110, 70, 0.07) 1px, transparent 1px); background-size: 14px 14px; }
  button, a { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #app { position: relative; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 12px) calc(env(safe-area-inset-left, 0px) + 16px); }

  /* ---------- HUD ---------- */
  #top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
  .chip { height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .chip:focus-visible, .tool:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #stageName { text-align: center; font-weight: 900; font-size: 17px; line-height: 1.15; }
  #stageName small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  #info { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 8px; }
  .card { background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; padding: 6px 8px 8px; text-align: center; min-width: 0; }
  .card small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; }
  .card .big { font-family: var(--num); font-weight: 700; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #movesCard .big { color: var(--ink); }
  #movesCard .big span { font-size: 15px; color: var(--muted); font-weight: 600; }
  #movesCard.low .big { color: var(--accent); }
  #goalTile { display: inline-grid; place-items: center; min-width: 40px; height: 32px; padding: 0 6px; margin-top: 3px; border-radius: 9px; font-family: var(--num); font-weight: 700; font-size: 19px; box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  #goalWhere { font-size: 11px; color: var(--accent-d); font-weight: 700; margin-top: 2px; min-height: 0; }
  #starsCard .row { display: flex; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 3px; white-space: nowrap; }
  #starsCard .row b { color: var(--gold); font-weight: 900; }
  #liveStars { font-size: 20px; letter-spacing: 1px; color: var(--gold); line-height: 1.2; }
  #liveStars i { font-style: normal; color: #e2d6c3; }

  /* ---------- board ---------- */
  #stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
  #board { position: relative; touch-action: none; background: var(--board); border-radius: 22px; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 6px 0 #cbbba3, 0 14px 30px rgba(120, 90, 50, 0.18); --cs: 60px; }
  #board.win { animation: glow 1.2s ease-out; }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(242, 179, 61, 0.9), 0 6px 0 #cbbba3; } 100% { box-shadow: 0 0 0 26px rgba(242, 179, 61, 0), 0 6px 0 #cbbba3; } }
  .cell, .tile, .arrow, .fx { position: absolute; left: 0; top: 0; width: var(--cs); height: var(--cs); }
  .cell { border-radius: 16%; background: var(--cell); }
  .cell.goal { background: #f8e3c9; box-shadow: inset 0 0 0 3px var(--accent); }
  .cell.goal::after { content: "★"; position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cs) * 0.42); color: rgba(232, 115, 90, 0.35); }
  .tile { border-radius: 16%; display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: calc(var(--cs) * 0.44);
    transition: transform 120ms cubic-bezier(.3,.7,.4,1), opacity 160ms; will-change: transform; box-shadow: 0 calc(var(--cs) * 0.06) 0 rgba(90, 60, 30, 0.2); }
  .tile .n { display: block; transition: transform 120ms; }
  .tile.d3 { font-size: calc(var(--cs) * 0.36); }
  .tile.d4 { font-size: calc(var(--cs) * 0.29); }
  .tile.pop .n { animation: pop 240ms ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.32); } 100% { transform: scale(1); } }
  .tile.pop::before { content: ""; position: absolute; inset: 0; border-radius: inherit; animation: ring 380ms ease-out forwards; box-shadow: 0 0 0 0 currentColor; }
  @keyframes ring { from { box-shadow: 0 0 0 0 rgba(255,255,255,0.9); } to { box-shadow: 0 0 0 calc(var(--cs) * 0.25) rgba(255,255,255,0); } }
  .tile.sel { z-index: 3; box-shadow: 0 0 0 calc(var(--cs) * 0.06) var(--ink), 0 calc(var(--cs) * 0.1) calc(var(--cs) * 0.12) rgba(60, 40, 20, 0.3); }
  .tile.gone { opacity: 0; }
  .tile.moving { z-index: 4; }
  .tile[data-e="1"] { background: #fbefd9; color: #7a6650; }
  .tile[data-e="2"] { background: #f8dcaa; color: #7a5a3a; }
  .tile[data-e="3"] { background: #f5b276; color: #fff; }
  .tile[data-e="4"] { background: #ef9064; color: #fff; }
  .tile[data-e="5"] { background: #e9706a; color: #fff; }
  .tile[data-e="6"] { background: #dc5a7b; color: #fff; }
  .tile[data-e="7"] { background: #b673cc; color: #fff; }
  .tile[data-e="8"] { background: #8687dc; color: #fff; }
  .tile[data-e="9"] { background: #589fd4; color: #fff; }
  .tile[data-e="10"], .tile[data-e="11"], .tile[data-e="12"], .tile[data-e="13"] { background: #3fa894; color: #fff; }
  .tile[data-e]:not([data-e="1"]):not([data-e="2"]) .n { text-shadow: 0 1px 0 rgba(0,0,0,0.12); }
  /* pinned: heavy frame with four rivets; once: dashed inner ring with a small 1 badge */
  .tile.pin { box-shadow: inset 0 0 0 calc(var(--cs) * 0.07) rgba(70, 50, 30, 0.45), 0 calc(var(--cs) * 0.06) 0 rgba(90, 60, 30, 0.25); }
  .tile.pin::after { content: ""; position: absolute; inset: calc(var(--cs) * 0.1); border-radius: 10%;
    background: radial-gradient(circle, rgba(70,50,30,0.55) 0 calc(var(--cs) * 0.035), transparent calc(var(--cs) * 0.04)) 0 0 / calc(var(--cs) * 0.12) calc(var(--cs) * 0.12) no-repeat,
      radial-gradient(circle, rgba(70,50,30,0.55) 0 calc(var(--cs) * 0.035), transparent calc(var(--cs) * 0.04)) 100% 0 / calc(var(--cs) * 0.12) calc(var(--cs) * 0.12) no-repeat,
      radial-gradient(circle, rgba(70,50,30,0.55) 0 calc(var(--cs) * 0.035), transparent calc(var(--cs) * 0.04)) 0 100% / calc(var(--cs) * 0.12) calc(var(--cs) * 0.12) no-repeat,
      radial-gradient(circle, rgba(70,50,30,0.55) 0 calc(var(--cs) * 0.035), transparent calc(var(--cs) * 0.04)) 100% 100% / calc(var(--cs) * 0.12) calc(var(--cs) * 0.12) no-repeat; }
  .tile.pin.sel { box-shadow: inset 0 0 0 calc(var(--cs) * 0.07) rgba(70, 50, 30, 0.45), 0 0 0 calc(var(--cs) * 0.06) var(--ink); }
  .tile.once::after { content: "1"; position: absolute; right: calc(var(--cs) * 0.06); top: calc(var(--cs) * 0.06); width: calc(var(--cs) * 0.24); height: calc(var(--cs) * 0.24); border-radius: 50%;
    background: var(--ink); color: #fff; font-size: calc(var(--cs) * 0.15); display: grid; place-items: center; line-height: 1; }
  .tile.once { outline: calc(var(--cs) * 0.035) dashed rgba(255,255,255,0.85); outline-offset: calc(var(--cs) * -0.1); }
  .tile.locked .n { animation: pop 240ms ease-out; }
  .tile.wall { background: repeating-linear-gradient(135deg, #8f8274 0 7px, #85786a 7px 14px); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18); }
  .tile.gate { background: repeating-linear-gradient(90deg, #6f6458 0 calc(var(--cs) * 0.08), transparent calc(var(--cs) * 0.08) calc(var(--cs) * 0.2)), #cdbda6; border-radius: 12%;
    box-shadow: inset 0 0 0 calc(var(--cs) * 0.05) #6f6458; }
  .tile.gate .n { background: var(--paper); color: var(--ink); border-radius: 999px; padding: 0 0.3em; font-size: calc(var(--cs) * 0.3); line-height: 1.3; box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .tile.gate.open { transform-origin: center; animation: gateOpen 420ms ease-in forwards; }
  @keyframes gateOpen { 30% { filter: brightness(1.5); } 100% { opacity: 0; filter: brightness(1.8); scale: 0.4; } }
  .tile.shake { animation: shake 260ms ease-out; }
  @keyframes shake { 20% { translate: var(--sx) var(--sy); } 45% { translate: calc(var(--sx) * -0.6) calc(var(--sy) * -0.6); } 70% { translate: calc(var(--sx) * 0.3) calc(var(--sy) * 0.3); } 100% { translate: 0 0; } }
  .arrow { display: grid; place-items: center; z-index: 5; pointer-events: none; }
  .arrow::before { content: ""; width: calc(var(--cs) * 0.34); height: calc(var(--cs) * 0.34); background: var(--ink); opacity: 0.75;
    clip-path: polygon(50% 8%, 95% 72%, 70% 72%, 50% 44%, 30% 72%, 5% 72%); rotate: var(--rot); animation: nudge 900ms ease-in-out infinite; }
  .arrow.merge::before { background: var(--accent); opacity: 1; }
  .arrow.hint::before { background: var(--teal); opacity: 1; width: calc(var(--cs) * 0.46); height: calc(var(--cs) * 0.46); }
  .arrow.hint { background: rgba(63, 154, 138, 0.18); border-radius: 16%; }
  @keyframes nudge { 50% { translate: calc(var(--dx) * 4px) calc(var(--dy) * 4px); } }
  .tutRing { position: absolute; left: 0; top: 0; width: var(--cs); height: var(--cs); border-radius: 18%; z-index: 6; pointer-events: none; box-shadow: 0 0 0 4px var(--teal); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(63, 154, 138, 0.25); } }
  .spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; z-index: 7; pointer-events: none; animation: spark 520ms ease-out forwards; }
  @keyframes spark { to { translate: var(--tx) var(--ty); opacity: 0; scale: 0.3; } }

  /* ---------- tools ---------- */
  #tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tool { height: 50px; padding: 0 4px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 700; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 3px 0 var(--line); }
  .tool:active { translate: 0 2px; box-shadow: 0 1px 0 var(--line); }
  .tool:disabled { opacity: 0.4; }
  .tool .cnt { font-family: var(--num); font-size: 13px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--bg); color: var(--muted); display: inline-grid; place-items: center; }
  .tool svg { width: 18px; height: 18px; }

  #status { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); pointer-events: none; }
  #toast { position: absolute; left: 50%; top: 8px; translate: -50% 0; z-index: 20; max-width: calc(100% - 16px); background: var(--ink); color: #fff; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; pointer-events: none; text-align: center; transition: opacity 200ms; }
  #toast.fade { opacity: 0; }
  #coach { position: absolute; left: 0; right: 0; top: 0; z-index: 15; background: var(--paper); border: 2px solid var(--teal); border-radius: 16px; padding: 8px 12px 10px; box-shadow: 0 6px 18px rgba(80, 60, 30, 0.15); }
  #coach .ct { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 900; color: var(--teal); }
  #cskip { font-size: 12px; font-weight: 700; color: var(--muted); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  #ctext { margin: 4px 0 0; font-size: 15px; font-weight: 700; line-height: 1.45; text-wrap: balance; }
  #ctext.warn { color: var(--accent-d); }

  /* ---------- panels ---------- */
  .panel { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-right, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 18px) calc(env(safe-area-inset-left, 0px) + 16px); background: var(--bg);
    background-image: radial-gradient(rgba(140, 110, 70, 0.07) 1px, transparent 1px); background-size: 14px 14px; }
  .panel > .center { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
  .panel h1 { margin: 0; font-size: 46px; font-weight: 900; letter-spacing: -0.02em; }
  .panel h2 { margin: 0; font-size: 26px; font-weight: 900; }
  .panel p.lead { margin: 0; color: var(--muted); font-size: 15px; font-weight: 500; }
  .btns { display: flex; flex-direction: column; gap: 10px; width: min(340px, 100%); }
  .row3 { display: flex; gap: 8px; }
  .row3 > * { flex: 1 1 0; min-width: 0; }
  .btn { height: 46px; padding: 0 6px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; text-decoration: none; box-shadow: 0 3px 0 var(--line); }
  .btn:active { translate: 0 2px; box-shadow: 0 1px 0 var(--line); }
  .btn.primary { height: 58px; font-size: 21px; font-weight: 900; color: #fff; background: var(--accent); border: 0; box-shadow: 0 4px 0 var(--accent-d); }
  .btn.primary:active { box-shadow: 0 2px 0 var(--accent-d); }
  .logo { display: flex; gap: 10px; align-items: center; justify-content: center; height: 84px; }
  .logo .tile { position: absolute; top: 0; --cs: 70px; transition: none; }
  .logo .pair { position: relative; width: 150px; height: 70px; }
  .logo .tile.a { left: 0; animation: logoA 3s ease-in-out infinite; z-index: 2; }
  .logo .tile.b, .logo .tile.c { left: 80px; }
  .logo .tile.b { animation: logoB 3s linear infinite; }
  .logo .tile.c { animation: logoC 3s ease-out infinite; }
  @keyframes logoA { 0%, 28% { translate: 0; opacity: 1; } 40% { translate: 80px; opacity: 1; } 41%, 90% { translate: 80px; opacity: 0; } 91% { translate: 0; opacity: 0; } 100% { translate: 0; opacity: 1; } }
  @keyframes logoB { 0%, 40% { opacity: 1; } 41%, 90% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes logoC { 0%, 40% { opacity: 0; scale: 1; } 47% { opacity: 1; scale: 1.2; } 54% { scale: 1; } 84% { opacity: 1; } 92%, 100% { opacity: 0; } }
  .help { list-style: none; margin: 0; padding: 0; width: min(380px, 100%); display: grid; gap: 7px; text-align: left; }
  .help li { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 9px 12px; font-size: 14.5px; font-weight: 500; line-height: 1.35; display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; }
  .help li .ic { width: 30px; height: 30px; --cs: 30px; position: relative; font-size: 13px; }
  .help li .ic .tile { position: absolute; transition: none; font-size: 13px; }
  .stats { width: min(380px, 100%); display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats div { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 4px; }
  .stats b { display: block; font-family: var(--num); font-size: 24px; font-weight: 700; }
  .stats small { font-size: 12px; color: var(--muted); font-weight: 700; }
  .recs { list-style: none; margin: 0; padding: 0; width: min(380px, 100%); display: grid; gap: 6px; text-align: left; }
  .recs li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 700; }
  .recs li .s { color: var(--gold); font-family: var(--num); }
  .recs li .m { color: var(--muted); font-size: 12px; font-family: var(--num); }

  /* stage select */
  #select { justify-content: flex-start; }
  #select .head { display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; width: min(460px, 100%); }
  #select .head .chip { justify-self: start; }
  #select .head .tot { justify-self: end; font-family: var(--num); font-weight: 700; color: var(--gold); font-size: 17px; }
  #daily { width: min(460px, 100%); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; text-align: left; padding: 12px 16px; border-radius: 18px; border: 0; color: #fff; background: linear-gradient(120deg, #3f9a8a, #5fb59a); box-shadow: 0 4px 0 #2f7c6f; }
  #daily b { display: block; font-size: 17px; font-weight: 900; }
  #daily small { font-size: 13px; opacity: 0.9; }
  #daily .go { font-family: var(--num); font-weight: 700; font-size: 15px; background: rgba(255,255,255,0.22); border-radius: 999px; padding: 6px 12px; }
  .chap { width: min(460px, 100%); text-align: left; }
  .chap h3 { margin: 6px 2px 2px; font-size: 16px; font-weight: 900; display: flex; justify-content: space-between; }
  .chap h3 span { font-family: var(--num); color: var(--gold); font-weight: 700; font-size: 15px; }
  .chap p { margin: 0 2px 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(64px, 18%), 1fr)); gap: 8px; }
  .lv { aspect-ratio: 1; border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: var(--num); font-weight: 700; font-size: 18px; box-shadow: 0 3px 0 var(--line); padding: 0; }
  .lv small { font-size: 10px; letter-spacing: 1px; color: var(--gold); min-height: 12px; line-height: 12px; }
  .lv small i { font-style: normal; color: #e0d4c2; }
  .lv.done { background: #fff4df; }
  .lv.cur { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-d); }
  .lv:disabled { opacity: 0.4; cursor: default; }

  /* result card (over the board) */
  #result { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; padding: 16px; background: rgba(245, 239, 228, 0.6); backdrop-filter: blur(2px); }
  #result .card2 { width: min(360px, 100%); background: var(--paper); border-radius: 24px; border: 2px solid var(--line); padding: 20px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 16px 40px rgba(90, 60, 30, 0.2); animation: rise 300ms cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { translate: 0 30px; opacity: 0; scale: 0.94; } }
  #rStars { font-size: 46px; letter-spacing: 4px; color: var(--gold); line-height: 1; }
  #rStars i { font-style: normal; color: #e7dccb; display: inline-block; }
  #rStars .s { display: inline-block; animation: starIn 420ms cubic-bezier(.2,.9,.3,1.5) backwards; }
  @keyframes starIn { from { scale: 0; rotate: -90deg; } }
  #rMsg { margin: 0; font-size: 15px; color: var(--muted); font-weight: 700; }
  #rMsg b { color: var(--ink); font-family: var(--num); }
  #perfect { font-weight: 900; color: #fff; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 999px; padding: 4px 14px; font-size: 15px; animation: starIn 500ms 300ms backwards; }
  #result .btns { width: 100%; }
  .confetti { position: absolute; top: -10px; width: 8px; height: 12px; z-index: 26; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { translate: var(--dx) 105vh; rotate: var(--r); } }
  #busy { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(245, 239, 228, 0.7); font-weight: 900; font-size: 18px; }

  /* landscape phones: board on the left, HUD + tools stacked on the right */
  @media (orientation: landscape) and (max-height: 560px) {
    #app { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 320px); grid-template-rows: auto auto 1fr auto; column-gap: 18px; row-gap: 8px; }
    #stage { grid-column: 1; grid-row: 1 / 5; }
    #top, #info, #tools { grid-column: 2; }
    #top { grid-row: 1; } #info { grid-row: 2; } #tools { grid-row: 4; }
    .card .big { font-size: 24px; }
    .tool { height: 44px; }
    .panel h1 { font-size: 34px; }
    .panel { gap: 10px; }
    .logo { height: 60px; }
    .logo .pair { scale: 0.75; }
  }
  @media (prefers-reduced-motion: reduce) { .tile, .tile .n { transition: none; } .arrow::before { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="chip" id="toSelect" type="button" aria-label="단계 선택">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3h10M2 7h10M2 11h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>단계</button>
    <div id="stageName">1-1<small>첫 걸음</small></div>
    <button class="chip" id="mute" type="button" aria-pressed="false">소리 켜짐</button>
  </div>
  <div id="info">
    <div class="card" id="goalCard"><small>목표</small><div id="goalTile" class="tile" data-e="4">16</div><div id="goalWhere" hidden>★ 칸에서</div></div>
    <div class="card" id="movesCard"><small>남은 이동</small><div class="big" id="moves">12<span>/12</span></div></div>
    <div class="card" id="starsCard"><small>최고 기록</small><div id="liveStars">★★★</div><div class="row" id="cuts"></div></div>
  </div>
  <div id="stage">
    <div id="board" aria-label="게임 판"></div>
    <div id="status" aria-hidden="true"></div>
    <div id="toast" class="fade" role="status" aria-live="polite"></div>
    <div id="coach" hidden>
      <div class="ct"><span id="cstep"></span><button id="cskip" type="button">건너뛰기</button></div>
      <p id="ctext" aria-live="polite"></p>
    </div>
  </div>
  <div id="tools">
    <button class="tool" id="undo" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4 3 8l4 4M3.5 8H12a5 5 0 0 1 0 10H8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>되돌리기<span class="cnt" id="undoN">3</span></button>
    <button class="tool" id="hint" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2a6 6 0 0 0-3.5 10.9V15h7v-2.1A6 6 0 0 0 10 2ZM7.5 18h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>힌트<span class="cnt" id="hintN">2</span></button>
    <button class="tool" id="restart" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>다시</button>
  </div>

  <div id="result" hidden>
    <div class="card2">
      <h2 id="rTitle">클리어!</h2>
      <div id="rStars"></div>
      <div id="perfect" hidden>완벽! 최소 이동</div>
      <p id="rMsg"></p>
      <div class="btns">
        <button class="btn primary" id="rNext" type="button">다음 단계</button>
        <div class="row3">
          <button class="btn" id="rRetry" type="button">다시 하기</button>
          <button class="btn" id="rRank" type="button">순위 보기</button>
          <button class="btn" id="rHome" type="button">처음으로</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="title">
    <div class="center">
      <div class="logo" aria-hidden="true"><div class="pair"><div class="tile b" data-e="3"><span class="n">8</span></div><div class="tile c" data-e="4"><span class="n">16</span></div><div class="tile a" data-e="3"><span class="n">8</span></div></div></div>
      <h1>원 무브</h1>
      <p class="lead">타일 하나를 한 칸씩 옮겨 합치는 퍼즐 게임</p>
      <div class="btns">
        <button class="btn primary" id="start" type="button">시작</button>
        <div class="row3">
          <button class="btn" id="howto" type="button">게임 설명</button>
          <button class="btn" id="rank" type="button">순위 보기</button>
          <a class="btn" id="toMenu" href="../">게임 선택</a>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="offer" hidden>
    <div class="center">
      <h2>처음이신가요?</h2>
      <p class="lead">1분이면 규칙을 익힐 수 있어요.</p>
      <div class="btns">
        <button class="btn primary" id="tutYes" type="button">튜토리얼 하기</button>
        <button class="btn" id="tutNo" type="button">건너뛰기</button>
      </div>
    </div>
  </div>

  <div class="panel" id="help" hidden>
    <div class="center">
      <h2>게임 설명</h2>
      <ul class="help" id="helpList"></ul>
      <div class="btns">
        <button class="btn primary" id="tutAgain" type="button">튜토리얼 하기</button>
        <button class="btn" id="helpBack" type="button">돌아가기</button>
      </div>
    </div>
  </div>

  <div class="panel" id="records" hidden>
    <div class="center">
      <h2>내 기록</h2>
      <div class="stats" id="stats"></div>
      <ul class="recs" id="recs"></ul>
      <div class="btns"><button class="btn" id="recBack" type="button">돌아가기</button></div>
    </div>
  </div>

  <div class="panel" id="select" hidden>
    <div class="head"><button class="chip" id="selBack" type="button">처음으로</button><h2>단계 선택</h2><span class="tot" id="selTot">★ 0</span></div>
    <button id="daily" type="button"><span><b>오늘의 퍼즐</b><small id="dailySub">매일 새로운 한 판</small></span><span class="go" id="dailyGo">도전</span></button>
    <div id="chapters" style="display:contents"></div>
  </div>

  <div id="busy" hidden>준비 중…</div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
