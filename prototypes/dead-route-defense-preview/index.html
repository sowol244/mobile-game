<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101412">
  <title>DEAD ROUTE · 1-1 로컬 미리보기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">DR</span><span>DEAD ROUTE <small>LOCAL</small></span></div>
      <button class="sound-button" id="soundBtn" type="button" aria-label="소리 끄기" title="소리 끄기">🔊</button>
    </header>

    <section class="battlefield" id="battlefield" aria-label="DEAD ROUTE 1-1 방어 전장">
      <canvas id="field" aria-label="화면을 좌우로 밀어 이동합니다. 사격은 자동입니다."></canvas>

      <div class="hud" id="hud" hidden>
        <div class="timer" id="clockText">00:00</div>
        <div class="health" role="meter" aria-label="체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-valuetext="100%"><span id="healthMeter"></span></div>
      </div>
      <div class="toast" id="toast" aria-live="polite"></div>

      <div class="scrim" id="introScrim">
        <article class="card">
          <span class="eyebrow">STAGE 1-1</span>
          <h1>좀비 떼를 막으세요.</h1>
          <p>밀어서 이동 · 자동 사격</p>
          <button class="start-button" id="startBtn" type="button">출동</button>
        </article>
      </div>

      <div class="scrim" id="resultScrim" hidden>
        <article class="card result-card">
          <span class="eyebrow" id="resultEyebrow">작전 종료</span>
          <h2 id="resultTitle">방어 성공</h2>
          <p id="resultCopy">1분을 버텼습니다.</p>
          <button class="start-button" id="restartBtn" type="button">다시 출동</button>
        </article>
      </div>
    </section>
  </main>
  <script type="module" src="preview.js"></script>
</body>
</html>
